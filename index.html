        // Render a page's lightweight markdown (paragraphs, **bold**, *italics*,
        // # headings, --- scene breaks) to HTML.
        function renderStoryMarkdown(content) {
            function inline(text) {
                return text
                    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
                    .replace(/\*([^*]+)\*/g, "<em>$1</em>");
            }
            return content.split(/\n{2,}/).map(function (block) {
                block = block.trim();
                if (!block) return "";
                if (/^(?:-{3,}|\*{3,}|(?:\* ){2,}\*)$/.test(block)) {
                    return '<hr class="story-divider">';
                }
                var heading = block.match(/^(#{1,6})\s+(.+)$/);
                if (heading) {
                    var level = heading[1].length >= 2 ? 4 : 3;
                    return "<h" + level + ">" + inline(heading[2].trim()) + "</h" + level + ">";
                }
                return "<p>" + inline(block).replace(/\n/g, "<br>") + "</p>";
            }).join("");
        }

        function showStoryPage() {
            ttsStop();
            document.getElementById("storyLibrary").style.display = "none";

            var pageContent = document.getElementById("storyPageContent");

            hideGlossaryPopover();

            if (storyPage < totalPages - 1) {

        // Underline the first occurrence of each glossary word in the rendered
        // page. Walks text nodes (never the HTML string) so existing <strong>/
        // <em> tags are preserved; wraps matches in <span class="glossary-word">.
        function applyGlossary(container, glossary) {
            if (!glossary || !glossary.regex) return;
            var re = glossary.regex;
            var used = new Set();
            var walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null);
            var nodes = [];
            var node;
            while ((node = walker.nextNode())) nodes.push(node);

            nodes.forEach(function (textNode) {
                var text = textNode.nodeValue;
                re.lastIndex = 0;
                var ranges = [];
                var m;
                while ((m = re.exec(text))) {
                    var idx = glossary.formMap[m[0].toLowerCase()];
                    if (idx !== undefined && !used.has(idx)) {
                        used.add(idx);
                        ranges.push({ start: m.index, end: m.index + m[0].length, idx: idx });
                    }
                    if (m.index === re.lastIndex) re.lastIndex++;
                }
                if (!ranges.length) return;

                var frag = document.createDocumentFragment();
                var pos = 0;
                ranges.forEach(function (r) {
                    if (r.start > pos) {
                        frag.appendChild(document.createTextNode(text.slice(pos, r.start)));
                    }
                    var span = document.createElement("span");
                    span.className = "glossary-word";
                    span.setAttribute("data-gi", r.idx);
                    span.textContent = text.slice(r.start, r.end);
                    frag.appendChild(span);
                    pos = r.end;
                });
                if (pos < text.length) {
                    frag.appendChild(document.createTextNode(text.slice(pos)));
                }
                textNode.parentNode.replaceChild(frag, textNode);
            });
        }

        var glossaryPopover = document.getElementById("glossaryPopover");

        function hideGlossaryPopover() {
            glossaryPopover.style.display = "none";
            glossaryPopover._anchor = null;
        }

        function showGlossaryPopover(wordEl) {
            var glossary = stories[currentStory].glossary;
            if (!glossary) return;
            var entry = glossary.entries[parseInt(wordEl.getAttribute("data-gi"), 10)];
            if (!entry) return;

            document.getElementById("glossaryPopoverTerm").textContent = entry.term;
            document.getElementById("glossaryPopoverMeaning").innerHTML = entry.meaningHtml;

            glossaryPopover.style.visibility = "hidden";
            glossaryPopover.style.display = "block";
            var rect = wordEl.getBoundingClientRect();
            var pw = glossaryPopover.offsetWidth;
            var ph = glossaryPopover.offsetHeight;
            var left = rect.left + rect.width / 2 - pw / 2;
            left = Math.max(8, Math.min(left, window.innerWidth - pw - 8));
            var top = rect.bottom + 8;
            if (top + ph > window.innerHeight - 8) top = rect.top - ph - 8;
            if (top < 8) top = 8;
            glossaryPopover.style.left = left + "px";
            glossaryPopover.style.top = top + "px";
            glossaryPopover.style.visibility = "visible";
            glossaryPopover._anchor = wordEl;
        }

        document.getElementById("storyPageContent").addEventListener("click", function (e) {
            var wordEl = e.target.closest ? e.target.closest(".glossary-word") : null;
            if (!wordEl) return;
            e.stopPropagation();
            if (glossaryPopover._anchor === wordEl && glossaryPopover.style.display !== "none") {
                hideGlossaryPopover();
            } else {
                showGlossaryPopover(wordEl);
            }
        });

        document.getElementById("glossaryPopoverClose").addEventListener("click", function (e) {
            e.stopPropagation();
            hideGlossaryPopover();
        });

        document.addEventListener("click", function (e) {
            if (glossaryPopover.style.display === "none") return;
            if (glossaryPopover.contains(e.target)) return;
            if (e.target.closest && e.target.closest(".glossary-word")) return;
            hideGlossaryPopover();
        });

        window.addEventListener("scroll", function () {
            if (glossaryPopover.style.display !== "none") hideGlossaryPopover();
        }, true);

        document.getElementById("storyNextPageBtn").addEventListener("click", function () {
            var story = stories[currentStory];
            var chapter = story.chapters[storyChapter];
            if (storyPage < chapter.pages.length - 1) {
                storyPage++;
                showStoryPage();
            } else if (storyChapter < story.chapters.length - 1) {
                storyChapter++;
                storyPage = 0;
                showStoryPage();
            } else {
                showStoryToc();
            }
        });

        document.getElementById("storyPrevPageBtn").addEventListener("click", function () {
            if (storyPage > 0) {
                storyPage--;
                showStoryPage();
            }
        });

        document.getElementById("storyBackToTocBtn").addEventListener("click", function () {
            showStoryToc();
        });

        document.getElementById("storyBackToLibraryBtn").addEventListener("click", function () {
            showStoryLibrary();
        });

        // === Mode Switching ===

        const flashcardsTab = document.getElementById("flashcardsTab");
        const quizTab = document.getElementById("quizTab");
        const flashcards2Tab = document.getElementById("flashcards2Tab");
        const quiz2Tab = document.getElementById("quiz2Tab");
        const typeQuizTab = document.getElementById("typeQuizTab");
        const storyTab = document.getElementById("storyTab");
        const talkTab = document.getElementById("talkTab");
        const hamburgerBtn = document.getElementById("hamburgerBtn");
        const hamburgerLabel = document.getElementById("hamburgerLabel");
        const modeToggle = document.getElementById("modeToggle");
        const cardContainer = document.querySelector(".card-container");
        const progressEl = document.getElementById("progress");
        const btnRow = document.querySelector(".btn-row");
        const quizContainer = document.getElementById("quizContainer");
        const typeQuizContainer = document.getElementById("typeQuizContainer");
        const storyContainer = document.getElementById("storyContainer");
        const talkContainer = document.getElementById("talkContainer");

        function switchMode(mode) {
            ttsStop();
            flashcardsTab.classList.remove("active");
            quizTab.classList.remove("active");
            flashcards2Tab.classList.remove("active");
            quiz2Tab.classList.remove("active");
            typeQuizTab.classList.remove("active");
            storyTab.classList.remove("active");
            talkTab.classList.remove("active");

            cardContainer.style.display = "none";
            progressEl.style.display = "none";
            btnRow.style.display = "none";
            quizContainer.style.display = "none";
            typeQuizContainer.style.display = "none";
            storyContainer.style.display = "none";
            talkContainer.style.display = "none";

            if (mode === "flashcards" || mode === "flashcards2") {
                words = mode === "flashcards2" ? words2 : words1;
                (mode === "flashcards2" ? flashcards2Tab : flashcardsTab).classList.add("active");
                current = 0;
                cardContainer.style.display = "";
                progressEl.style.display = "";
                btnRow.style.display = "";
                showCard();
            } else if (mode === "quiz" || mode === "quiz2") {
                words = mode === "quiz2" ? words2 : words1;
                (mode === "quiz2" ? quiz2Tab : quizTab).classList.add("active");
                quizContainer.style.display = "block";
                startQuiz();
            } else if (mode === "typeQuiz") {
                typeQuizTab.classList.add("active");
                typeQuizContainer.style.display = "block";
                startTypeQuiz();
            } else if (mode === "story") {
                storyTab.classList.add("active");
                storyContainer.style.display = "block";
                showStoryLibrary();
            } else if (mode === "talk") {
                talkTab.classList.add("active");
                talkContainer.style.display = "block";
                startTalk();
            }

            const activeBtn = modeToggle.querySelector(".mode-btn.active");
            if (activeBtn) hamburgerLabel.textContent = activeBtn.textContent;
            closeMenu();
        }

        function openMenu() {
            modeToggle.classList.add("open");
            hamburgerBtn.setAttribute("aria-expanded", "true");
        }

        function closeMenu() {
            modeToggle.classList.remove("open");
            hamburgerBtn.setAttribute("aria-expanded", "false");
        }

        hamburgerBtn.addEventListener("click", function (e) {
            e.stopPropagation();
            modeToggle.classList.contains("open") ? closeMenu() : openMenu();
        });

        document.addEventListener("click", function (e) {
            if (!modeToggle.contains(e.target) && e.target !== hamburgerBtn) closeMenu();
        });

        flashcardsTab.addEventListener("click", function () { switchMode("flashcards"); });
        quizTab.addEventListener("click", function () { switchMode("quiz"); });
        flashcards2Tab.addEventListener("click", function () { switchMode("flashcards2"); });
        quiz2Tab.addEventListener("click", function () { switchMode("quiz2"); });
        typeQuizTab.addEventListener("click", function () { switchMode("typeQuiz"); });
        storyTab.addEventListener("click", function () { switchMode("story"); });
        talkTab.addEventListener("click", function () { switchMode("talk"); });

        // === TTS (Text-to-Speech via Puter.js + ElevenLabs) ===

        var voicePresets = [
            { name: "Rachel", id: "21m00Tcm4TlvDq8ikWAM" },
            { name: "Adam", id: "pNInz6obpgDQGcFmaJgB" },
            { name: "Bella", id: "EXAVITQu4vr4xnSDxMaL" },
            { name: "Antoni", id: "ErXwobaYiN019PkySvjV" },
            { name: "Domi", id: "AZnzlk1XvdvUeBnXmlld" },
            { name: "Elli", id: "MF3mGyEYCl7XYWbV9V6O" },
            { name: "Josh", id: "TxGEqnHWrfWFTfGW9XjX" },
            { name: "Sam", id: "yoZ06aMxZJJ28mfd3POQ" }
        ];

        var ttsState = {
            status: "idle",
            audio: null,
            voiceId: localStorage.getItem("tts_voice_id") || voicePresets[0].id,
            model: localStorage.getItem("tts_model") || "eleven_multilingual_v2",
            chunks: [],
            currentChunk: 0
        };

        function ttsSplitText(text) {
            text = text.replace(/\*\*(.*?)\*\*/g, "$1");
            text = text.replace(/\*(.*?)\*/g, "$1");
            text = text.replace(/^#{1,6}\s+/gm, "");
            text = text.replace(/^\s*(?:-{3,}|\*{3,})\s*$/gm, "");
            text = text.replace(/\n{2,}/g, " ").trim();
            if (text.length <= 2800) return [text];
            var chunks = [];
            var remaining = text;
            while (remaining.length > 0) {
                if (remaining.length <= 2800) {
                    chunks.push(remaining);
                    break;
                }
                var slice = remaining.substring(0, 2800);
                var splitAt = slice.lastIndexOf(". ");
                if (splitAt === -1) splitAt = slice.lastIndexOf(".\n");
                if (splitAt === -1) splitAt = slice.lastIndexOf(" ");
                if (splitAt === -1) splitAt = 2800;
                else splitAt += 1;
                chunks.push(remaining.substring(0, splitAt).trim());
                remaining = remaining.substring(splitAt).trim();
            }
            return chunks;
        }

        function ttsUpdateUI() {
            var btn = document.getElementById("ttsPlayBtn");
            var icon = document.getElementById("ttsIcon");
            var label = document.getElementById("ttsLabel");

            if (!btn || !icon || !label) return;

            btn.className = "tts-play-btn";
            icon.className = "tts-icon";

            if (ttsState.status === "idle") {
                icon.innerHTML = "&#9654;";
                label.textContent = "Listen to this page";
            } else if (ttsState.status === "loading") {
                btn.classList.add("loading");
                icon.innerHTML = "&#9696;";
                icon.classList.add("spinning");
                label.textContent = "Loading audio...";
            } else if (ttsState.status === "playing") {
                btn.classList.add("playing");
                icon.innerHTML = "&#9632;";
                label.textContent = "Stop reading";
            } else if (ttsState.status === "error") {
                btn.classList.add("error");
                icon.innerHTML = "&#9888;";
                label.textContent = "Error — try again";
            }
        }

        function ttsStop() {
            if (ttsState.audio) {
                ttsState.audio.pause();
                ttsState.audio.currentTime = 0;
                ttsState.audio.onended = null;
                ttsState.audio = null;
            }
            ttsState.status = "idle";
            ttsState.chunks = [];
            ttsState.currentChunk = 0;
            ttsUpdateUI();
        }

        function ttsPlayChunk(index) {
            if (index >= ttsState.chunks.length) {
                ttsState.status = "idle";
                ttsState.audio = null;
                ttsUpdateUI();
                return;
            }
            ttsState.currentChunk = index;

            var timeoutId = setTimeout(function () {
                if (ttsState.status === "loading") {
                    ttsStop();
                    showTtsNotification("Audio loading timed out. Please try again.", "error", 5000);
                }
            }, 30000);

            puter.ai.txt2speech(ttsState.chunks[index], {
                provider: "elevenlabs",
                voice: ttsState.voiceId,
                model: ttsState.model
            }).then(function (audio) {
                clearTimeout(timeoutId);
                if (ttsState.status !== "loading" && ttsState.status !== "playing") return;
                ttsState.audio = audio;
                ttsState.status = "playing";
                ttsUpdateUI();
                audio.onended = function () {
                    ttsPlayChunk(index + 1);
                };
                audio.play();
            }).catch(function (err) {
                clearTimeout(timeoutId);
                handleTtsError(err);
            });
        }

        function ttsPlay() {
            if (ttsState.status === "loading" || ttsState.status === "playing") {
                ttsStop();
                return;
            }

            if (typeof puter === "undefined" || !puter.ai) {
                showTtsNotification("Text-to-speech is not available. Puter.js failed to load.", "error", 5000);
                return;
            }

            var rateLimitDate = localStorage.getItem("tts_rate_limit_date");
            if (rateLimitDate) {
                var now = new Date();
                var limitDate = new Date(rateLimitDate);
                var renewDate = new Date(limitDate.getFullYear(), limitDate.getMonth() + 1, 1);
                if (now < renewDate) {
                    showTtsNotification(
                        "Monthly audio credits are used up. Credits renew on " +
                        renewDate.toLocaleDateString("en-US", { month: "long", day: "numeric" }) + ".",
                        "warning", 8000
                    );
                    return;
                } else {
                    localStorage.removeItem("tts_rate_limit_date");
                }
            }

            var pageText = stories[currentStory].chapters[storyChapter].pages[storyPage];
            ttsState.chunks = ttsSplitText(pageText);
            ttsState.status = "loading";
            ttsUpdateUI();
            ttsPlayChunk(0);
        }

        function handleTtsError(err) {
            ttsState.status = "error";
            ttsState.audio = null;
            ttsUpdateUI();

            var isRateLimit = false;
            if (err) {
                var errStr = (typeof err === "string") ? err : JSON.stringify(err);
                if (err.status === 429 || errStr.indexOf("rate_limit") !== -1 ||
                    errStr.indexOf("quota") !== -1 || errStr.indexOf("limit") !== -1) {
                    isRateLimit = true;
                }
            }

            if (isRateLimit) {
                localStorage.setItem("tts_rate_limit_date", new Date().toISOString());
                var renewDate = new Date();
                renewDate = new Date(renewDate.getFullYear(), renewDate.getMonth() + 1, 1);
                showTtsNotification(
                    "Monthly audio credits are used up. Free tier includes about 10 minutes per month. " +
                    "Credits renew on " + renewDate.toLocaleDateString("en-US", { month: "long", day: "numeric" }) + ".",
                    "warning", 10000
                );
            } else {
                showTtsNotification("Could not load audio. Please try again.", "error", 5000);
            }

            setTimeout(function () {
                if (ttsState.status === "error") {
                    ttsState.status = "idle";
                    ttsUpdateUI();
                }
            }, 3000);
        }

        function showTtsNotification(message, type, duration) {
            var area = document.getElementById("ttsNotificationArea");
            area.innerHTML = "";
            var el = document.createElement("div");
            el.className = "tts-notification " + type;
            el.textContent = message;
            area.appendChild(el);
            setTimeout(function () {
                if (el.parentNode) el.parentNode.removeChild(el);
            }, duration || 5000);
        }

    </script>
