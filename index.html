# The Roots Department
### (Simple English version)

---

*For my mother —*

*who I love a lot, more than I can say in one sentence.*

*This story is for you.*

---

## Chapter 1 — The Queue

Maya's hands knew the keyboard very well. She worked eight hours a day, five days a week. Her fingers moved on the keys without looking, the way some people play the piano without looking.

She worked on the fourth floor of a glass building. She worked in the call center of a company called OriginTree. The company sold the past. You paid money. You put some spit in a small plastic tube. You sent the tube to the company. Six weeks later, the company sent you back a map with colored circles on it. *You are 31% from here. You are 22% from there.* People paid a lot of money for these circles.

Maya's job was to answer the phone when the circles were not enough.

"Thank you for calling OriginTree. My name is Maya. How can I help you today?"

She said this sentence approximately sixty times a day. She said it so many times that the words stopped feeling like words. They were only sounds now. Her mouth said them while her mind stood somewhere behind her and watched.

On her screen there was a number. The number showed how many people were waiting in the queue. On a quiet morning, the number was four or five. On a busy Monday, it could go over two hundred. Then a red light turned on above the room, and the team leaders walked between the desks and said, "Keep it moving. Keep it moving."

The people in the queue all wanted to ask the same question, in different words: *Who am I?*

This was the strange thing about Maya's job. She tried not to think about it too much. Strangers called her — Maya, twenty-six years old, with a headset on her head — and they asked her to tell them who they were. She opened their file. She looked at their circles. And she read the past to them, like a weather report.

"Yes, sir. I see it here. Your results show approximately forty percent from Spain and Portugal."

"Forty percent? My mother always said we were Irish."

"There is some of that too, sir. Eleven percent."

"Eleven? Only eleven?"

People got aggravated about the numbers. This surprised the new workers. It did not surprise Maya anymore. A man could be happy for fifty years. Then a colored circle on a screen told him he was eleven percent of something, not forty percent. And his whole voice changed. Some people cried. Some people shouted. One woman wanted her money back, because the test found Norwegian family. She had already bought an expensive Scottish skirt.

Maya was good at making these people calm. She knew how to pacify even the angriest caller. It was her special talent — her manager said so. She knew how to slow her voice down. She knew how to leave small soft spaces between her words. She knew how to say "I understand" in a kind way. The angry people became calm. The crying people stopped crying and said thank you. After each call, the computer sent the customer a short questionnaire: *How would you rate your service today, from one to five?*

Maya's rate was 4.9.

There was a big screen on the wall of the call center. It showed the ranks of all forty workers. It changed every hour. Maya had been number one for seven months. Her name was at the top of the list, in green letters: **M. ALON — 4.9**. Below her name, the other names moved up and down, like swimmers in a pool. But her name did not move. The team leaders pointed at it in training. "This is what we want," they said. "Be like Maya."

Sometimes Maya looked at her name on the screen and felt nothing.

The company liked to keep track of everything. Calls each hour. Seconds for each call. Even smiles. Yes — smiles. Someone believed that customers could hear a smile through the phone. So the workers had to smile while they talked. Near the coffee machine there was a poster of a cartoon sun. The sun was wearing a headset. All day, Maya smiled into the phone, at people who could not see her face. By five o'clock, her face was tired.

In the breaks, the other workers stood by the windows and talked. They talked about their weekends, about apartments that were too expensive, about a new café downstairs. Nadav, from the second row, wanted everyone to join a running group. "It will change your life," he said, holding his paper cup. "Sunday mornings. By the sea. Come on, Maya, I'll sign you up."

"Maybe," said Maya. That was her slow way of saying no.

The truth was, her Sunday mornings were already busy.

Every Sunday, Maya took two buses south, out of the city, to a small old street. The houses there were low, and the gardens touched each other over the fences. At the end of the street there was a green gate. You had to lift it a little before it would open. Behind the gate lived Maya's grandmother, Rosa.

Rosa had no file at OriginTree. She never put spit in a tube. If you asked her where the family came from, she waved her hand in the air, like she was pushing away a fly, and she said, "From far away. Eat."

Maya knew the names of her customers' great-great-grandmothers. She knew the village, the port, the ship. She could trace a stranger's family back two hundred years in four clicks.

About her own family, she knew almost nothing.

She knew her grandmother's hands. She knew the garden. She knew the smell of the soup. For a long time, on the fourth floor of the glass building, this had felt like enough.

It was spring when everything changed. But at the start, nothing looked like change. At the start it looked like a normal Sunday, and a pot of soup, and one small word that came out wrong.

## Chapter 2 — Sunday at Rosa's

The green gate had a trick. You had to lift it a little, push with your side, and then it opened with a long sound, like an old man getting up from a chair. Maya had known this trick since she was six years old. Now her hands did it without thinking, the same way they typed at work.

Behind the gate, the garden began right away. There was no clean path. The garden was everywhere. Tomato plants leaned on the fence on wooden sticks. They were full of fruit at every stage. Some tomatoes were green and hard. Some were orange. Some were so ripe that their skin had opened in the sun, and they stood there shining and open. Mint grew where it wanted. A lemon tree stood in one corner. And under the fig tree, in the deep shade, if you were quiet and lucky, you could see the toad.

The toad had lived in the garden for many years. Rosa said it was the same toad from thirty years ago. Maya's mother said that toads do not live thirty years. Rosa said, "Mine does." And that was the end of it.

"Savta?" Maya called. (*Savta* means grandmother.)

"In the kitchen. Wipe your feet. The garden is on them."

The garden was always on everything. That was the point of it, Maya thought. The whole small house smelled of soil, and lemons, and something older under that — the cool smell of clay.

Rosa had been a potter. Not as a hobby — as her life. For forty years there was a potter's wheel in the back room, and a small oven for clay in the yard. Rosa's pots went out into the world. They held other people's flowers, and salt, and ashes. The wheel had a sheet over it now. Her hands, she said, had stopped working before the rest of her. But the pots were still there. They were everywhere — on every shelf and every step. Bowls, jugs, plates, cups with a small dent in the handle, exactly where your thumb wanted to be. When Maya was a child, she thought all dishes were like this — heavy, warm in color, each one a little different. The first time she ate at a friend's house, the white factory plates almost scared her. They were so light. They looked like they were trying not to be there.

In the kitchen, Rosa stood at the stove and stirred the soup.

She was small now, and smaller every year. Her face was covered in wrinkles. Her arms were still a potter's arms — strong. When she stirred the pot, she stirred from the shoulder.

"Taste," she said, instead of hello.

This was the rule of the house. Maya took the wooden spoon and tasted. The soup was orange and thick, with lentils and carrots, and a soft secret taste of cumin under it.

"It needs nothing," Maya said.

"It needs five more minutes. Sit."

Maya sat. This was also the rule. In Rosa's kitchen you sat, you were given food, and you answered questions while Rosa stood with her back to you, adding seasoning to a pot that needed nothing, and listening with her whole back.

"So. The work," Rosa said.

"The work is the work."

"They still make you smile at the telephone?"

"They still do."

Rosa made a small sound in her throat. To her, Maya's job was one of the funniest things in the modern world. *People pay money to be told where their grandmother was born. They should call their grandmother. It's cheaper.*

"And you eat? At this work?"

"There's a cafeteria."

"A cafeteria," Rosa said, the way other people say "a swamp." She turned around with the spoon in her hand. "When your mother was your age, she also lived on air and coffee. Then she fainted in a bank. Did she ever tell you she fainted in a bank?"

"Forty times."

"Good. So faint in a bank too, who am I to talk." But she was smiling now, and the wrinkles moved into their happiest shape. She put bread on the table, and a clay bowl of oil, and tomatoes that were part of the garden ten minutes ago.

They ate. The sun moved slowly across the table. Rosa told the news of the street: the neighbor's son who finally found work, the cat that was pregnant again (apparently), the woman from number twelve who cut down a healthy orange tree. Rosa told the orange tree story like it was a terrible crime. Maya told small, safe stories from work — the woman with the Scottish skirt, the man who wanted to be more Italian. Rosa laughed until she had to put her spoon down.

"And your tomatoes," Maya said. "The crop is good this year?"

"The crop is too good. Come."

After lunch they went out into the garden, like always. Rosa walked between the plants and touched things. This leaf. This stick. This fruit. She did not really check them. It was more like a queen saying hello to her people. The soil here was dark and fertile. For fifty years she had fed it with kitchen water, coffee, and eggshells. Everything that grew here seemed to thrive, even when it didn't try. The fig tree alone gave more fruit than three families could eat. Figs lay on the ground in the shade, so ripe they were almost starting to decay, and bees flew in slow circles above them.

"Take figs when you go," said Rosa. "Take tomatoes. Take mint."

"Savta, I have one bag."

"So come back on Thursday for the rest."

By the fence, Maya bent down to look under the fig tree, into the cool green dark. Two golden eyes looked back at her — calm and very old.

"He's still here," she said.

"Where would he go?" said Rosa. "He has everything. Shade, water, flies, a view." She leaned on the fence. "He's no fool, the —"

And there she stopped.

It was a very small thing. A hole in the sentence, the size of one word. Rosa stood with her hand on the fence and looked at the toad. And Maya watched her search for the word. She really searched — the way you search a drawer, lifting things and putting them down — for the word *toad*.

"The prince," Rosa said at last, and waved her hand in the air. "He's no fool, the prince."

She said it like a joke. Maybe it was a joke. The afternoon went on. They picked figs. The bag was filled past arguing. At the green gate, Rosa held Maya's face in both hands, like always, and said, "Eat something that isn't coffee," like always.

On the first bus home, Maya decided it had been a joke. *The prince.* It was funny. It was exactly Rosa's kind of funny.

On the second bus, with the bag of warm figs on her knees, she stopped deciding, and just looked out the window.

Sixty times a day, strangers asked Maya to find their lost words for them — names, villages, ships. She knew, better than anyone, how a word can fall out of the world.

She kept the figs on her kitchen table for a week, until they went from ripe to bad. She could not say why she did not eat them.

## Chapter 3 — The Free Kit

In April, the company started a new campaign. It was called **Kickstart Your Story**. For three weeks it was everywhere — on the walls of the elevator, in everyone's email, on little cards next to the coffee machine, under the smiling cartoon sun. The posters showed a young woman on a mountain at sunrise. She was holding the plastic tube up to the light, like it was a torch.

*Your story did not start with you,* the posters said. *Find out where. Kickstart your story today.*

"Her story started with spit," said Tomer, who sat on Maya's left. He was counting the days until the end of his contract. "Nice sunrise, though."

For the campaign, every worker could order one kit for free. The HR department sent the link three times. *Don't miss it! The offer ends Friday!* By Wednesday, most of the floor had signed up. Partly they were curious. Partly it is hard to say no to a free thing, and nobody at the call center had extra energy.

Maya did not sign up on Wednesday. She could not say why. She read the email. She moved her mouse to the link. Then a call came in, and then another, and the day swallowed the question, the way it swallowed everything.

On Thursday, Mr. Mandelbaum called again.

Mr. Mandelbaum was famous on the fourth floor. He was eighty-one years old. He lived alone in Haifa. He had bought a kit fourteen months ago. His results had come long ago, and many workers had explained them to him many times. But he still called. He called every week, sometimes twice. He always had one small official question that took one minute. After that came forty minutes of everything else.

The new workers did not like his calls, because he made their numbers bad. The team leaders had a special code for him in the computer. The old workers had a joke: the queue at OriginTree was Mr. Mandelbaum's hangout. Other men his age had a bench in the park, or a chair at a café. He had a phone number and a lot of time.

That Thursday, the computer sent him to Maya.

"OriginTree, my name is Maya, how —"

"Maya!" he said, happy, like they had met on the street after many years. "The famous Maya. They gave me the champion."

"How can I help you today, Mr. Mandelbaum?"

"A small question. In my results, it says 2% from the Caucasus. My question is: is this a lot?"

It was not a lot. He knew it was not a lot. He had asked the same question in February. But Maya opened his file again. She looked at his circles again. She told him what 2% might mean. And he listened with great happiness — the way you listen to the weather report for a city where someone you love lives.

Then, with the question finished, he stayed on the line.

He told her that his neighbor's grandson had fixed his computer, and now the letters on the screen were huge. He told her that the sea in Haifa had been gray all week, like a knife. And then — this was really why he called, but he reached it slowly, after twenty minutes — he told her that his wife had passed away, and her birthday had been on Sunday. He had bought a kit for his daughter in Toronto. But his daughter had not used it yet. "Eight months the tube is sitting in her kitchen," he said. "What does it cost her? A little spit. But young people are busy."

The number on Maya's screen blinked: eleven people waiting. Twelve. Her work numbers were dying quietly in front of her. The smart thing, the thing she was trained to do, was to end the call: *Is there anything else I can help you with today?* — the sentence that ends a conversation.

"Maybe she is afraid," Maya heard herself say instead.

There was a pause on the line.

"Afraid," said Mr. Mandelbaum. "Of what? It's spit, not surgery."

"Afraid of what the answer might change. Or afraid that the answer means less to her than it means to you — and that you will see that." Maya was looking at the queue and not seeing it. "People are not busy for eight months. People are slow when something is heavy."

The silence was so long that she thought the call had ended.

"You are not like the other champions," Mr. Mandelbaum said at last. "The others are polite. You listen." He said it like a doctor saying what is wrong. Then, in a happy voice again: "So. The Caucasus. Two percent. You say it's the mountains?"

When the call ended — twenty-eight minutes, very bad for her hourly numbers — Maya sat for a moment with her hands in her lap. Around her, the floor was full of noise: forty voices reading the past to strangers. On her other screen, the HR email was still waiting. *The offer ends Friday!*

She thought about Rosa's hand on the fence, searching the air for a word the size of a toad.

She thought: this test is not for me. I don't care about circles. It's a toy. It's a sunrise made of spit. It's a distraction.

Then she thought something else. It came all at once, cold, like something that had been waiting a long time in a back room: Rosa will never do this test. Rosa waves her hand in the air. *From far away. Eat.* And one day, that wave of the hand will be all that is left. Everything Rosa knows and does not say is written in only one place. And that place is Rosa.

Maya clicked the link. She typed her name, her address, her worker number. It took ninety seconds. The last screen had a drawing of confetti on it: *Congratulations! You just kickstarted your story!*

"Welcome to the club," said Tomer, without looking.

The kit came to her apartment four days later, in a small white box. Inside there was the tube, a funnel, instructions in eleven languages, and a small folded questionnaire about her family history. *Where were your four grandparents born? (If you know.)*

She sat at her kitchen table with a pen, and she could not write past her own name. The figs were gone from the table now, but the table still smelled a little sweet where they had been. She skipped the questionnaire. She put spit in the tube — not a nice thing to do, which the posters were smart not to show — closed it, and put it by the door, so she would not forget it in the morning.

It stood there in the dark, a small white tower with the whole sleeping past inside it. Maya lay in bed and could not sleep. She could not say why. And some time after midnight, she understood: she was not doing this *instead* of asking Rosa.

She was doing it because she was afraid to ask Rosa.

It's spit, not surgery, she told herself. And she slept.

## Chapter 4 — Results

The email came on a Tuesday, at 11:42 in the morning, between a call about a lost password and a call about a disappointing grandfather.

**Your OriginTree results are ready!**

Maya knew this email very well. She had helped thousands of customers open it. *Click the green button, sir. Now you see a map.* But she had never been on the other side of it.

She did not open it at work. This surprised her a little. She had thought she would open it between calls, quickly, the way you check the weather. Instead, she carried the email home on the two buses, like something that could break. She ate dinner first. She washed the plate. And only then she sat down with the laptop and clicked the green button.

A map of the world opened, dark blue and beautiful. Then the circles began to appear on it, one by one. It was the company's little show. She watched her own life become a pie chart.

**Eastern Mediterranean — approximately 61%.**
**Spain and Portugal — approximately 22%.**
**The Balkans — approximately 9%.**
**North Africa — approximately 5%.**
**Other — 3%.**

She looked at it for a long time.

She had explained these numbers to a thousand strangers. Now she found that she did not really understand them. They were correct — the science was real, she could explain the science — but they felt light, like a fact about another person. *Approximately 61%.* The word *approximately* had never bothered her before. Tonight it felt like the only honest word on the screen. The past, measured to the nearest guess.

There was more. There was a newer part, the part the company was most proud of: **Ancestral Journeys**. The computer compared your DNA to its big library of people, living and dead, and it drew you a path. *We can trace your ancestry,* the page said, *to a group of families that lived, two or three hundred years ago, here* —

and the map zoomed in.

It flew down out of the dark blue. It passed Italy. It went east. It stopped on a piece of coast where two seas came close and almost touched. A thin line of water between them. A strait — with a name Maya had to read twice. The name meant nothing to her. It rang no bell in her memory. On the north side of the water, the computer had put a glowing dot.

*Your ancestors probably lived in or near this port city for many generations,* the text said, in the warm letters the company used for feelings. *DNA from this group appears strongly in your results.*

Maya looked at the dot. The dot looked back, glowing and sure.

A city. A real city, with a name, on a real strait. People who had lived there for many years, and whose faces had come down through time and arrived — by two buses — at this kitchen table. The screen knew this. Her own mother, Maya was fairly sure, did not know this. And she herself — the champion of the fourth floor, number one for seven months, the one who explained the past to the whole country — had not known it at 11:41 this morning.

She did what her customers did. She searched the city online.

Photos came up: a harbor, hills, white buildings above the water, seabirds. There were old photos too, brown ones — fishing boats, a market, women in long dresses on a steep street. And in almost every photo, high on the hill above the harbor, there was the same shape: heavy pale walls, a tower, the strong stubborn shape of an old fort.

The caption called it the citadel.

---

She went south on Thursday, instead of waiting for Sunday. She had the laptop in her bag and a speech in her head. The speech had a few versions. In all of them she was calm and grown-up. In all of them the conversation went well.

Rosa was in the garden, fighting the mint, which had grown over some line during the week. She looked up, and her face did what it always did when Maya came — it opened, simply, like a door opening into a bright room.

"Thursday," Rosa said. "Who died?"

"Nobody died, Savta."

"Then sit, and we'll find a reason."

There was lemonade in a clay jug. The toad was in his shade. The afternoon was warm and normal. And minute by minute, Maya understood that every version of her speech had been written for some other grandmother. Twice she began. The first time she got as far as "Savta, at work —" before Rosa sent her to bring the good glasses. The second time, Rosa was telling the story of the orange tree at number twelve, and you simply cannot interrupt that.

Finally Maya just opened the laptop on the garden table, between the rings of lemonade, and turned it to face Rosa.

"What is this?" said Rosa.

"It's me. It's a test from my company. From spit. It shows the origins of the family — where we come from."

Rosa looked at the map with polite, far-away interest, the way she looked at all screens, like they were fish tanks.

"Sixty-one percent," she read. "Of what?"

"Of — the region. The eastern Mediterranean."

"For this they needed your spit? I could tell them this from your eyebrows." She pushed the laptop gently back, half a centimeter. "Drink. The ice is melting."

"Savta." Maya turned the screen back. Her heart was working harder than it should. "It found a city. It says the family lived there. Look — here, by the strait."

And she watched.

She watched her grandmother's eyes go to the glowing dot, and stop, and stay there. The garden went on around them — but there was a sudden still circle, one meter wide, with a small old woman in the middle of it. Rosa's face did not change, exactly. But something behind it changed. A door that had stood open for eighty years was very quietly closed.

"Computers," Rosa said. "They print a map, people cry. It's a business, Mayaleh. You work there. You know best of all what it is."

"Is it true? Did the family live there?"

"The family lives here." When Rosa lifted the jug, her hand did not shake at all — and somehow that was the most frightening thing, all that effort to stay steady. "From far away, I told you. Far is far. Drink."

Maya drank. The conversation moved on. Rosa moved it on, firmly, the way police move traffic past an accident. She told two stories. She criticized the government once. She sent Maya to pick lemons for the road.

It happened at the green gate, at the very end, in the gold evening light. Rosa held Maya's face in both hands, like always. But she held it one moment longer than always. Her eyes went somewhere far away, past Maya's shoulder, past the street. And she said, in a voice Maya had never heard before — a voice with no walls in it at all:

"There was a citadel. Above the water. White, in the morning. From the boat, it was the last thing you could see."

Then the door behind her face closed again. She patted Maya's cheek. She said, "Eat something that isn't coffee." She lifted the green gate with her side, and she was gone, back among her tomatoes.

Maya stood in the street with a bag of lemons.

The laptop had said *approximately*. The laptop had said *probably*. Rosa had said *from the boat, it was the last thing you could see* — and there was nothing approximate in it. Nothing probable. It was not data. It was a window, open for four seconds, eighty years deep.

All the way home, on both buses, Maya held the bag of lemons on her knees and thought one thing, around and around:

She never told me she came on a boat.

## Chapter 5 — What Rosa Will Not Say

Maya's mother answered the phone the way she answered all phones — with worry first, and hello second.

"Yes? Maya? What happened?"

"Nothing happened. Why does everyone in this family think the phone is a hospital?"

"Because in this family, it used to be. So? Talk."

Maya talked. The test, the map, the dot on the strait, the city, the citadel. Her mother listened. Maya could hear her listening — she could hear the dishes stop moving on the other end. And when Maya reached the green gate, and the boat, and *the last thing you could see*, there was a long silence with a long history inside it.

"She said that? About the boat?"

"Word for word."

"To you she said this." It was not jealousy in her mother's voice. It was something harder to name — the sound of a person hearing that a door, locked to her for her whole life, had opened four seconds for someone else.

"Ima. What do you know?" (*Ima* means mother.)

"What do I know." Her mother laughed, but there was no laugh in it. "I know what fits in one sentence. Because that is how she gave it out. One sentence at a time. One a year, if you behaved."

But she stayed on the phone. And slowly, the way water finds a small crack, it came out — not the family's story, which she did not have, but the story of *trying* to get it, which she had all of.

She told Maya about being eleven years old, in fourth grade. The teacher gave them homework: make a family tree. *Roots*, the homework was called. Bring photos. Talk to your grandparents. Half the class came back with big trees, branches on branches, uncles on every line. She came home to Rosa — *we lived with her then; your grandfather was already gone* — with her notebook and her sharp pencil. She felt very official. She was the interviewer.

"And?"

"And it was the only time in my life she shouted at me. The only time. About homework." Her mother's voice had gone strange and young. "Then she saw my face, and she stopped, and she sat down, and she gave me sentences. There was a city. There was the sea. They came when she was sixteen. The end. I drew a tree with one branch, and the teacher thought I did not do the homework."

After that, her mother said, it became the war of her teenage years. She pushed; Rosa closed. She shouted that she had a right to know where she came from; Rosa said, in that hard voice, *You come from this kitchen.* They were bickering about the past for years, and it changed nothing. Slowly the fight just wore out, and they stopped — without ever saying they had stopped — and they never started again.

"You know what she told me once? The closest she ever came?" Her mother breathed. "I screamed at her — I was maybe seventeen — I screamed, *Everyone has ancestors. Everyone. Even you.* And she looked at me and said: 'Ancestors are a luxury, Dina. We left in a hurry. We took what we could carry.'"

Maya sat with the phone against her ear and her eyes closed.

"There is a candle," her mother said, quieter now. "You have seen it. You just never noticed it. Every year, at the end of October — no date on any calendar of ours. She lights a candle in the kitchen. She does not pray. She does not say anything. She will not say who it is for. Once — only once — when I was small and did not know to be afraid, I asked her. She said: 'For the brothers.' Two words. For fifty years I have been turning those two words over."

"Brothers. Her brothers?"

"I don't know, Maya. I don't know if they died or lived. I don't know if they got on a different boat, or stayed on the dock. I asked Aunt Sima before she passed away — Sima came from the same city, they knew each other from there — and Sima told me only this: 'It was chaos at the port. Lists, no lists. Families lost track of each other in one afternoon. Anyone who tells you they remember it in order is lying.'" A pause. "And then Sima said one more thing. I never forgot it. She said: 'Your mother does not refuse to remember, Dinaleh. She refuses to remember *out loud*. It is not the same thing.'"

Outside Maya's window, the city made its evening noise. On her laptop, asleep on the table, there was a glowing dot that knew the exact place of all of this, and none of the meaning.

"Ima. Why did you never just keep digging? Records. Archives. You could have."

The silence this time was her mother choosing to be honest. Maya could hear the choice being made.

"Because she built us a whole world with her two hands," her mother said. "The house, the garden, the wheel, us. All of it on top of that silence. Like a house built on a sealed floor. And somewhere I decided that the silence was holding the house up. You do not dig under your own house, Maya." A beat. "Also, she is my mother, and she shouted at me once in 1974, and I am still not over it. Write that down too."

---

That Sunday, the soup needed nothing, like always. But Rosa was tired, more tired than usual. After lunch she sat in the wicker chair under the fig tree, and her eyes closed in the middle of a sentence about the city council. Maya put the thin blanket over her knees and sat on the step and watched her sleep.

Old age, Maya thought, has two hands. With one hand it takes things away — words, names, the days of the week. And with the other hand, sometimes, when no one is looking, it gives something back.

Because Rosa was talking in her sleep. Not loud. A soft sound, in a language Maya did not know — not the language Rosa cursed in, another one, older, with soft worn edges. Under the wrinkles, her face was moving, like water moving under ice. When she was awake, Rosa never talked about the past; everyone knew that about her. She did not reminisce, ever. The other grandmothers on the street told old stories every day — *in our village, in those days* — and Rosa would make a sound and say the past was a country with bad service and she did not go there on holiday. But asleep, under the fig tree, with the toad watching from his green dark, she was there. Wherever *there* was. Her hand on the blanket opened and closed, opened and closed — holding something, or letting it go.

Then she said it. Clearly. A word that came up whole out of the soft sounds:

"Estreya."

Maya went still.

"Estreya," Rosa said again — and her voice broke open in the middle of the name. Out of the break came a soft love, so bare and so young, that Maya looked away from her sleeping face, the way you look away from someone who is not dressed. "Estreya, dame la mano. Ya viene el vapor."

Then the soft sounds went back under, and the garden was only a garden again — bees, and afternoon, an old woman asleep in a chair.

Maya did not move for a long time. She had no idea what the words meant. In fact, she did not look them up until that night, on the bus, with the bag of lemons on her knees. Only then did she learn that they were in the old Spanish that her family had carried out of Spain long ago, and kept alive for five hundred years in a port city on a strait. And that the words meant:

*Estreya, give me your hand. The boat is coming.*

She called her mother from the bus.

"Ima. Who is Estreya?"

And her mother — who did not know the name of one single person from that lost city, who had a family tree with one branch — said slowly:

"I have no idea. But you just found the candle."

## Chapter 6 — Decay

In June, Rosa put a pot of soup on the stove and went out to the garden. She forgot the soup. She forgot the stove. At four in the afternoon, the neighbor smelled smoke.

In the end, nothing burned except the pot, the soup, and a certain story the family had been telling itself. There was a black mark on the kitchen wall above the stove. Rosa was angry — at the pot, at the neighbor, at the whole idea of the fire department. And her anger was so normal, so completely her, that for an hour everyone almost laughed about it.

Then Maya's mother found, in the drawer under the telephone, four electricity bills. They were not opened. They were in a neat little pile. And on the back of one envelope, in Rosa's handwriting, there was a list:

*Dina — daughter
Maya — Dina's girl
Thursday — garbage
The blue pills — morning*

People keep track of what they are losing, in the order they are losing it.

---

What came next, Maya would remember as one long hallway.

It was not really one hallway. It was many — the health clinic, the hospital, the memory clinic, the National Insurance office. But in her memory they all became one hallway with white lights and a number machine at the end. Take a ticket. Wait. The screen blinks. *Now serving 304.* You are 351.

She found out that the world she worked in had a twin, and the twin was darker. Here too there were scripts. Here too there was waiting on the phone. That summer, she spent — she counted — eleven hours listening to the health clinic's hold music. It was a loop of fake string instruments, and she started to hear it in her sleep. *Your call is important to us. You are number eight in the queue.* Once, while waiting, she caught herself listening to the worker who finally answered — the slow voice, the empty warmth, the "I understand" placed like furniture — and she understood that she was listening to herself. She had to sit down.

There were questionnaires. So many questionnaires. Page after page of small print, asking in forty different ways if her grandmother was still able to live like a person. *Can the patient dress herself? Cook food? Manage money? Is the patient a hazard to herself or others?*

That word. *Hazard.* A hazard is a wet floor. A hazard is a loose wire. Her grandmother had crossed a sea at sixteen with one suitcase and built a whole world out of clay and tomatoes. And now she was being filed under the same word as a hole in the road.

At the memory clinic — the venue was a clinic that used to be a bank, and the doctors' rooms still had the heavy doors of the old bank safes — a kind, tired doctor gave Rosa the test. Maya sat in the corner. She was told not to help.

"What year is it, Rosa?"

"A bad one."

"And the season?"

"Ask my tomatoes. They keep track."

"I am going to say three words, and later I will ask you to say them back. Apple. Table. Coin."

"Apple, table, coin." She waved her hand. "A poor man's shopping list."

She knew the year, in the end, after a pause that everyone in the room pretended not to count. She did not know the date. She drew a clock with all twelve numbers pushed into the right half of the circle, like passengers all standing on one side of a leaning boat. And ten minutes later, when the doctor asked for the three words again, Rosa looked at her with her chin up and her eyes narrow — the look of a fort above a harbor — and said:

"They are gone. Write that I let them go."

In the hallway after, the doctor spoke to Maya and her mother in a soft, careful voice, like someone telling you the weather of a country you are about to move to. She used the word *Alzheimer's*, with soft words around it — *early, mild, we will watch it.* She talked about the rate, with the honesty of a tired good doctor: *every patient goes at her own rate; some go fast; some stay the same for years, good years; we treat it, we slow it, we do not promise.* There was a small booklet, and a date for the next visit, and the strange double gift of a name for the thing and no date attached to it.

Her mother drove home with both hands high on the wheel, saying nothing. At a red light she said, "She will cling to that house with her fingernails. She will hold on and never let go. You know that. She would rather burn with it."

"So we make sure it does not burn, Ima. We do not make her leave the garden. The garden is half her memory. It is the half that still works."

---

But the garden knew.

This was the thing Maya could not have explained to the doctor, or to the forms, or to anyone who had not stood in it. The garden got worse at the same rate as the gardener. Rosa forgot to water it one day in two, then two days in three. The hot summer pushed in. And the green world behind the gate began, quietly, to step back. The mint gave up first, going gray at the edges like paper held near a flame. The tomato plants stopped making fruit, and the little fruit they had, they let drop off, still green, into the dry dirt — small hard green balls.

Now Maya came three times a week, then four. She rolled up her sleeves and pulled the hose down the rows in the evening heat. She watched the water turn away into the cracked ground, like water going down a drain. She was not a gardener. She had never been one. For twenty-six years she had been a visitor in this garden, eating its fruit, knowing nothing. Now she learned by trial and error, in the worst possible classroom. Some things came back. Some things did not. Under the fig tree, where the shade was still dense and the fallen figs went soft and dark, the sweet smell of ripe fruit slid one small step over into the smell of decay. The bees flew their slow circles over it. And the toad sat in his cool kingdom, golden-eyed, watching the small empire fail around him.

Rosa came outside less. She watched from the wicker chair, wrapped in a sweater in August, and gave orders that were sometimes orders and sometimes the memory of orders. *Water deep, not often. Pinch the small shoots. No, not that, that is not a weed, that is oregano* — this last one when Maya was holding a weed, nowhere near the oregano, and they both knew it, and neither of them said it.

One evening at the end of August, the watering was done and the light lay on the ground in copper stripes. Rosa was quiet for so long that Maya thought she had fallen asleep. Then Maya saw that her grandmother was looking at her own hands, turned palms-up in her lap, like two old letters in a language she was starting to lose.

"Mayaleh."

"Savta."

"The hands forget last," Rosa said. She said it like a simple fact, the way she would say the soup needs five more minutes. "Everything else is a colander — the water runs out through the holes. But the hands forget last."

She closed her fingers. She opened them.

"Sunday," she said. "Come early. Wear something with old sleeves."

"Old sleeves? Why?"

But Rosa was looking past her, at the dark back room of the house, where for fifteen years a covered wheel had stood under a sheet, holding its shape in the dark, like everything else she would not say out loud.

"Because on Sunday," said Rosa, "I am teaching you the clay."

## Chapter 7 — The Clay

The sheet came off the wheel with a breath of dust. Under it, the wheel looked like a sleeping animal. It was smaller than Maya remembered. Everything from childhood was smaller now.

Rosa had woken up early and was more *here* than she had been in weeks. The morning hours were her good hours now; the family had learned to plan love around them, like flights. She wore her old apron, hard with fifteen-year-old clay. She had made Maya roll her sleeves up past the elbow, looked at the result, and rolled them up higher.

The clay lived in a block in the corner, wrapped in plastic. The first surprise was that it was alive. Not as a way of speaking — really, stubbornly alive. You had to cut it with a wire held in two hands. The piece Rosa cut came away smooth and dense, like cheese, and cool like a cellar. She slapped it down on the table and showed Maya how to push the air out of it — press and fold, press and fold.

"Air is the enemy," Rosa said. "A bubble hides inside. Quiet. Polite. You see nothing. Then the fire finds it." She brought her hand down flat. "Boom. The whole pot is gone, and its neighbors in the oven too. What is hidden does not stay small, Mayaleh. In the fire, everything hidden gets a vote."

She said it about the clay. She said everything about the clay that morning. That was the system, and Maya understood it within an hour: the clay was a country where they could say anything, and both of them were allowed in.

The wheel turned. Rosa's foot remembered the rhythm before her face did. Maya saw it happen — she saw the body arrive somewhere before the mind, the same way her own hands typed greetings she did not even hear anymore. *The hands forget last.* Rosa took the clay, threw it at the center of the wheel, cupped her hands around it, and fifteen years of retirement fell away in approximately four seconds.

"Now you."

It was a disaster, and the disaster was the lesson.

Centering, it turned out, was everything — and centering was almost impossible. The clay spun under Maya's hands and pushed her off, like a small planet that did not want her. If it sat even a little bit off the center of the wheel, every turn made it worse. The smallest bump — a tiny protrusion you could hardly feel — grew bigger with each turn. It wobbled. It got wider. And then the whole thing fell over her fingers.

"You see?" Rosa was delighted. On the wheel, failure made her happy; it was the lesson. "A small thing, off center. You think, it's nothing, I'll fix it later. But the wheel turns, and turns, and every turn the nothing gets bigger. Sixty turns, it's a wave. A hundred turns, it's a flood. On the wheel there is no 'later,' Mayaleh. There is only now, now, now." She put her hands over Maya's hands — strong and sure, the skin loose over the strength — and held them still against the spinning clay. "Don't fight it. Hold still, and let it find you. You are the center. Be boring. The clay loves boring."

By noon, Maya had ruined eleven pieces of clay and made one thing. A kind judge could call it a bowl. The walls were thick on one side and thin on the other. The top edge was not straight. The whole thing leaned, like a boat about to tip.

She learned the words of fixing: a little water, a small tweak — one push with one knuckle inside the curve — a flat tool pulled up the wall to make it straight — *gently, you are not the police.* She learned that water was a loan, not a gift; too much, and the walls drank it and got soft and fell. She learned that pottery was nothing but trial and error, so old that it had become wisdom. Every rule Rosa said — and she said them like holy words — was the scar of ten thousand broken pots. Hers, and her teachers', and the dead's. "Glaze, we will not get to today," Rosa said, looking at the leaning bowl. "But remember: a good glaze hides nothing. It only enhances what is already there. Lies are for paint."

And somewhere in the middle of all this — Maya could never say exactly when, because there was no warning, no deep breath, no *now I will tell you* — somewhere between one ruined pot and the next, with the wheel turning and both their hands wet, Rosa began to talk.

"My father had a workshop two streets above the harbor," she said, her hands cupped around the spinning clay. "Pots, tiles, jars for oil. Oil and fish — that was the staple there. Everything in that city was for oil and fish. The clay came on donkeys from the hills. After rain, the whole street smelled like this. Exactly like this. You opened the window, and the city smelled like a wheel."

Maya did not move. She had the feeling you have near a wild animal that has come close on its own — that the whole world depends on you staying still.

"I was at the wheel from six years old. My brothers had no patience for it — Moshiko wanted the boats, Albert wanted the girls — but me, the wheel. And Estreya." The name came out flat, normal, one name among names. Only Rosa's foot on the pedal changed its rhythm for half a turn. "Estreya was small. Seven years younger than me. She used to sit there — there, like you, exactly there — and her job was the water. She held the sponge. The minister of water, my father called her. Estreya means *star*, in our Spanish. She was born at night. So — a star."

The wheel turned. The walls of the pot rose up under Rosa's fingers, even and sure.

"In October it ended. I will not tell you the politics. The politics you can read; the politics is in books." She waved one muddy hand at all the books in the world. "What is not in any book is the port. One afternoon. Everyone at once. The lists did not match the boats, and the boats did not match the names, and there was a man at a table with a stamp, deciding the future of the world, one family at a time. We had papers for one boat — one *vapor* — all six of us. Then we had papers for two boats. Then for one boat and a maybe. My mother is shouting at the man with the stamp. My father is holding the money inside his coat. And I am sixteen, and I am holding Estreya's hand, because that is my whole job in the world. The minister of water. That is my job."

The pot rose. It was the best pot of the day, and Rosa was not even looking at it.

"She saw something. A dog, a soldier's horse — I never knew. Sixty years, you understand, I have had a lot of time to not know. She pulled. Children pull. And at the same moment, the suitcase was falling off the cart on my other side — the suitcase with the photographs and the candlesticks, our whole house in one suitcase — and I let go of her hand to catch it."

The wheel turned. Now, now, now.

"One minute," Rosa said. "Less. I caught the suitcase. The crowd moved like water. And the crowd put my mother and my father and me at the rope of our boat. And it put Moshiko and Albert and Estreya twenty meters away, behind the fence, with my aunt. Twenty meters. And the man with the stamp had finished being kind for that day."

Her foot slowed. The wheel slowed too, the hum going down.

"The second boat had a name. I knew that name for sixty years, and now, some mornings, I don't — it comes back at night; names come back at night. The second boat was going to leave in three days. From the deck of our boat, I saw them on the dock — small, like this —" she held up a muddy thumb and finger, a centimeter of air between them, "— and above them the citadel, white in the morning sun. The last thing you could see. I told you that part already." A pause. "I waved. Estreya did not wave. She was looking for my hand in the crowd, you understand. At the wrong height. She was looking for a hand."

The wheel stopped.

"Three days later, the politics closed the port," Rosa said, in the voice of someone reading a label on a jar. "The second boat never left. We wrote letters to the city for two years. Then the city stopped answering. After the war we wrote to committees, to lists, to the Red Cross. Your great-grandmother wrote until her hands stopped working, and then I wrote. There was no trace. You looked for one name in all that fire, and you got back silence with a file number. In 1952, a man from our old street found us here — he had been on the dock those three days. He said the brothers tried to put Estreya on a fishing boat across the strait, to cousins on the other side. He saw them pay for it. He did not see the boat leave. That is the whole record, Mayaleh. A man saw them pay."

She looked at her hands, muddy to the wrist.

"At the clinic. The doctor with the three words. Apple, table, coin." Something moved across Rosa's face that was almost, terribly, a smile. "Sixty years I have kept three names instead — and a boat, and a hand. Now the colander is losing the year, and the date, and the prime minister, who is no loss. And every morning I check — like you check a pocket — what is gone. Because if her name goes while I am still alive to know that it went —"

She did not finish. She did not need to finish. She took the best pot of the day off the wheel with the wire, in one clean pull, and set it on the board next to Maya's leaning bowl. She looked at the two of them — the beautiful one and the disaster — side by side.

"Yours we keep," she said.

"Savta, it's crooked."

"It's crooked," Rosa agreed. "So is everything that lives long enough to be saved."

They cleaned up slowly, in the quiet that comes after. They scraped the wheel. They washed up to the elbow. The water ran gray-brown into the drain, and the smell of wet clay rose off everything, like the smell of a street in a city under the sea. On the bus home, Maya held her bowl in both hands, wrapped in newspaper, still a little wet. It was the only thing she owned that held the whole afternoon inside it — the port, the citadel, the centimeter of air between a thumb and a finger. Her laptop at home held the dot, the map, the percentages. This was heavier. This was the past the way Rosa had always kept it: not spoken, not written.

It was something you could touch. It was tangible.

That night, for the first time in her life, Maya lit a candle in October, in her own kitchen. She sat with it. She did not say anything. And she began — at last, at the wrong height, in the wrong century — to look for a hand in the crowd.

## Chapter 8 — Down the Line

There was one bad night that winter, and it has to be told, because of what happened in it.

In January, Rosa got a fever. Just a normal winter fever, the doctor said — nothing serious, water and rest. But a fever, in a mind that is already coming loose at the edges, opens doors. Maya was staying over that night; they took turns now, she and her mother, Sundays and Tuesdays and the nights after hard days. At three in the morning, Maya woke to a sound. She found Rosa sitting up in bed, hot, lost somewhere with no map, her arm out, her hand opening and closing in the dark.

"Estreya," Rosa said. Not afraid. Sure, and busy, and sixteen years old: "Estreya, dame la mano. Ya viene el vapor."

And Maya — who had practiced that sentence on two buses for months without knowing why, the way you keep a key to a house you have never seen — crossed the room. She put her hand into the opening and closing hand, at exactly the right height, and answered in her bad new old Spanish:

"Aquí está. Aquí está la mano." *Here it is. Here is the hand.*

Rosa's fingers closed. Her whole body let go of something — Maya felt it leave, like a guard who has stood at a door for sixty years finally going home. Rosa lay back, and slept until morning, holding on.

By the end of the week the fever was gone, and Rosa was back at the stove, shocked by what Maya had done to a soup while she was sick. But Maya kept that night. Sitting in the dark with her arm going numb, refusing to move it, she understood something. She had been allowed to fix one second of the port — one second out of all the seconds — the one with the suitcase and the hand. The wheel turns, and there is no later. But it turns, Rosa had never said, in a circle.

---

The illness, now that it had shown itself, then did the thing the tired good doctor had said it sometimes does: it slowed down and stayed still.

Not better — there is no better; the year still went missing some mornings, and the date was gone for good, and the names of far cousins now came a beat late, like an overseas phone call. But it held. Whole good months. The house arranged itself around the good hours, the way the garden arranged itself around the sun. Mornings were for the wheel and the important talk. Afternoons were for the wicker chair. The pills lived in a plastic box with the days printed on it, and the days were crossed off by three different hands.

The third hand was Dina's.

Maya's mother began, in the spring, to come on Thursdays. At first she came with the face of someone doing a duty, defended up to the chin. But the garden worked on her the way the clay had worked on Rosa: it was a country where things could be said sideways. Rosa, who had never once taught her daughter anything without the lesson turning into a fight, now taught her — at seventy-nine — to pinch the small shoots off the tomatoes. She held Dina's hand and guided it and made a low sound of approval. And Dina, fifty-eight years old, glowed like a girl with a good report card, and pretended she did not.

"All those years," Dina said to Maya once, watching Rosa check their work down the row. "I thought she was keeping the past away from us. She wasn't, you know. She was standing between us and it. That is a different thing. It took me until this garden to understand it."

---

Maya went back to her full shifts in March. The fourth floor was exactly where she had left it: the queue breathing on the screen, the cartoon sun over the coffee machine, the board with the ranks. Her name had dropped to fourth place while she worked half-days — **M. ALON**, in small white letters. She looked at it and waited to feel something, and felt nothing, and was glad.

It was there, on a Tuesday, between a call about a lost password and a call about a disappointing grandfather, that the email came.

**You have a new DNA relative!**

The computer, working slowly and patiently through its growing library of the world's spit, had found a thread. *Probably a 3rd or 4th cousin,* it said. A username. No photo. An account from across the strait — the far side, the side a fishing boat had once been paid to reach, where the cousins had lived. *Shared DNA: 1.1%.* Approximately, of course. Probably. Maybe.

It was nothing. It was a tiny number; she of all people knew how little it might mean; she had explained that very smallness to a thousand strangers, gently, sixty times a day. The records that could have proven anything were gone — a hundred years of destruction had eaten the port's lists, the synagogue books, the city itself as it once was. And over all of that, one computer had quietly laid down one thread.

She looked at it for a long time. Then she wrote a message, in simple English, four sentences long. She gave her grandmother's first name, and the name of the city. She did not tell the story; the story was not hers to spend. The last sentence took her until the end of her shift, and in the end it was this: *My grandmother had a little sister. We never stopped looking — we only lost track of how.*

She pressed send. And then came the part that is not on any poster: the waiting.

It was Mr. Mandelbaum, of all the people in the world, who helped her through it. He called in April with a small official question — 2% Caucasus, was it a lot — and she answered it for the fifth time. And then, because the queue was short, and because some walls had come down in her that year and stayed down, she told him: that she had sent a message across the sea, and that it had been three weeks, and that she checked every morning, like checking a pocket.

"Three weeks," said Mr. Mandelbaum, with the deep calm of a man who had waited for letters back when letters were made of paper. "Listen to me, champion. A message like that does not just get read. It gets *carried around*. Right now, somebody over there is walking with it — to a sister, to an aunt, to the one person in the family who keeps the names. Every family has one, the keeper of names. It will answer when it has finished traveling. You taught me this yourself: people are slow when something is heavy." A pause, and she could hear him smiling. "My daughter, by the way. The tube. She used it — two weeks after we spoke that time. Four percent of something nobody expected. She called me laughing from Toronto, at her own midnight. That was your doing, down the line."

"I just answered a call, Mr. Mandelbaum."

"Yes," he said. "That is the whole job, if anyone asks."

---

The answer came in May, at night. Maya read it standing up in her kitchen, and then sat down on the floor and read it again.

It was from a woman on the far side of the strait — the granddaughter of the username — writing in careful, borrowed English. *Forgive my English. My grandmother's name was Estreya. She came to my family's village in the war, a child, alone, off a fishing boat, with a paper pinned inside her coat. The paper had her name on it, and the name of her father's workshop. Our great-grandfather knew that workshop. He kept her.*

She lived. That was the whole of it, and the size of it. Estreya grew up on the other side of the strait, in a town on a hill above the water — in sight, Maya checked the map and her breath went strange — in actual sight, on clear days, of the very city she had been put on a boat to escape. She married. There were children, and the children's children. And there was, the woman wrote, a garden — *figs, you should see the figs, too many to eat.* Estreya had died fifteen years ago, in her sleep, an old woman with her family around her.

About the brothers, the letter knew nothing. They had put her on the boat and stepped back into the crowd, and the crowd had kept them. The letter did not pretend it was otherwise, and Maya was grateful to it for that.

But there were two more things in the letter, and they were the two that broke her open.

The first: *She always told us she had a big sister across the sea, who could make the wheel sing. When we did not believe that a person can make a wheel sing, she got angry.*

The second: *Every year in October my grandmother lit a candle, and she would not say who it was for. We thought it was for her parents. Now I think you and I have been lighting the same candle, from two sides of the same water, and nobody knew.*

There was a photo with the letter. An old woman in a garden, laughing at something outside the picture, one hand up against the sun, standing under a fig tree.

---

Maya told Rosa on a Sunday morning, in the good hours, at the kitchen table, with the laptop closed; she had decided the screen would not be in the room. She told it the way Rosa had taught her to tell things: plainly, in order, with her hands flat on the table. The boat that crossed. The paper pinned in the coat. The town on the hill, in sight of the citadel. The figs. The long life. The sleep at the end of it, the family all around her. The big sister across the sea who could make the wheel sing.

Rosa sat completely still through all of it, her eyes on Maya's hands. When it was finished, she was quiet for so long that the kitchen clock got loud.

"Sixty years I asked the dark," she said at last, in a voice that came from very deep down. "It knew the whole time. It could have told me." Then, almost in the same breath, because she was Rosa: "Did she have a garden?"

"Figs. The granddaughter says there are too many to eat."

"Of course figs." Rosa closed her eyes. Under the wrinkles, something moved like water under ice, and then went still. "She held the sponge," she said, to no one, to the table, to a workshop two streets above a harbor. "The minister of water. Of course a garden."

She did not cry — or if she did, it was later, and alone, the way a fort cries. What she did instead was simple, and complete, and it happened in October.

That year, when the date with no name came around, Rosa did not light the candle alone in a silent kitchen. She had the family in — Dina, Maya, the neighbor from number eight who had brought soup for ten years and never asked for anything. She lit two candles. And for the first time in anyone's memory, she said names over them, out loud, in a steady voice: her brothers' names, into the first candle, still looking for them; and over the second candle, the name she had kept for sixty years in the dark, like a seed in a jar:

"Estreya. Who lived."

The flame leaned, and then stood up straight. And somewhere across a strait, on a hill in sight of a white citadel, the same small light was being put in a window, by people the family had never met — and now, slowly, in two careful languages, two photos a month, was starting to know.

---

Two things are left to tell.

The story does not end with a journey, though there may be one down the line. The granddaughter has written: *the door of our house is open; the sea is small.* And Maya has begun, on Thursday evenings, to learn a portion of the old Spanish from recordings, so that if she ever stands in that garden, she will be able to say more than *here is the hand.*

The story does not end with a cure, because there is no cure. The colander is a colander. There will be harder years, and everyone in the small house behind the green gate already knows their shape, and has decided to be there for them anyway — which is most of what deciding is.

The story ends where it started, on a Sunday, in the garden.

The crop came back crooked that summer — Maya's rows would never be Rosa's rows — but it came back. The tomatoes split their skins again in the heat. The mint took back its old land. The fig tree filled with fruit, with the total, forgetful confidence of fig trees. Rosa watched from the wicker chair and gave orders that were sometimes orders and sometimes memories of orders, and was obeyed either way. The toad sat in his dense green shade, golden-eyed, the most reliable neighbor on the street, keeping the only records he had ever kept, and they were enough: shade, water, flies, a view.

On the kitchen windowsill there were two bowls. Rosa's best pot was not one of them. One was the small bowl her hands had made on a quiet afternoon, with no help from the rest of her. The other was Maya's famous disaster — thick on one side, thin on the other, its top edge not straight, leaning like a boat about to tip — holding, that summer, a handful of seeds for next year. Because that is what bowls are for. And it held them.

It was crooked. It held them anyway.

Somewhere in the city to the north, a queue was blinking, and strangers were waiting in it to be told who they were, and the telephones were ringing down all the lines. Here, there was water going into soil, and two women arguing in a friendly way about oregano, and the smell of wet earth rising from the rows, like the smell of a street above a harbor. And the garden — which had been spoken to in soup and in silence for fifty years, and had finally been answered — leaned toward summer with its whole body, and did what it had always done, over every silence and every sea. It began to thrive.

**The end.**

# The Roots Department — Glossary

Non-trivial words from the story, with their meaning **as they are used in the story**. (The target vocabulary words, taught in the Vocabulary tabs, are not included here.)

---

**apron** — a piece of cloth you wear over your clothes to keep them clean while working. *"She wore her old apron, hard with fifteen-year-old clay."*

**ashes** — the soft gray powder left after something burns. Rosa's pots held *"other people's flowers, and salt, and ashes."*

**booklet** — a very thin book of just a few pages. The doctor gives the family *"a small booklet"* about the illness.

**campaign** — a planned set of actions to reach a goal; here, an advertising push. *"The company started a new campaign."*

**caption** — the small line of words under a photo that tells you what it shows. *"The caption called it the citadel."*

**cellar** — a cool room under a house, used for storage. The clay is *"cool like a cellar."*

**centering** — putting the clay exactly in the middle of the spinning wheel. *"Centering, it turned out, was everything — and centering was almost impossible."*

**chaos** — complete confusion and mess, with no order. *"It was chaos at the port."*

**colander** — a bowl full of holes, used to drain water off food. Rosa's image for a failing memory: *"Everything else is a colander — the water runs out through the holes."*

**committee** — a group of people chosen to deal with something together. *"After the war we wrote to committees, to lists, to the Red Cross."*

**confetti** — tiny pieces of colored paper thrown at celebrations. The screen shows *"a drawing of confetti."*

**contract** — a work agreement, often for a fixed length of time. Tomer was *"counting the days until the end of his contract."*

**crooked** — not straight; bent or leaning to one side. *"Savta, it's crooked."* — Maya's first bowl.

**cumin** — a brown spice with a warm, strong taste. The soup has *"a soft secret taste of cumin."*

**dent** — a small dip pressed into a surface. The cups have *"a small dent in the handle, exactly where your thumb wanted to be."*

**dock** — the platform by the water where boats stop and people board. The brothers were left behind *"on the dock."*

**donkey** — a small animal like a horse, used to carry heavy loads. *"The clay came on donkeys from the hills."*

**faint** — to suddenly drop and lose consciousness for a moment. *"Then she fainted in a bank."*

**fever** — a high body temperature when you are ill. *"In January, Rosa got a fever."*

**fig** — a soft, sweet, round fruit that grows on a tree. The garden's *"fig tree alone gave more fruit than three families could eat."*

**fort** — a strong building made to defend a place against attack. The old citadel has *"the strong stubborn shape of an old fort."*

**funnel** — a tube wide at the top and narrow at the bottom, used for pouring into a small opening. The kit contains *"the tube, a funnel, instructions in eleven languages."*

**glaze** — a thin, shiny, glass-like coating on pottery. *"A good glaze hides nothing. It only enhances what is already there."*

**harbor** — a sheltered area of water where boats stay safely. Photos showed *"a harbor, hills, white buildings above the water."*

**headset** — earphones with a microphone, worn to talk on the phone hands-free. *"Maya, twenty-six years old, with a headset on her head."*

**hold music** — the music played to you while you wait on the telephone. *"Eleven hours listening to the health clinic's hold music."*

**hose** — a long, bendy tube that carries water. *"She pulled the hose down the rows in the evening heat."*

**jealousy** — the unhappy feeling that someone else has what you want. *"It was not jealousy in her mother's voice."*

**jug** — a container with a handle and a lip, for holding and pouring drinks. *"There was lemonade in a clay jug."*

**knuckle** — the bony joint where a finger bends. *"one push with one knuckle inside the curve."*

**lentil** — a small, flat seed cooked and eaten like a bean. The soup has *"lentils and carrots."*

**luxury** — something pleasant and costly that you do not really need. *"Ancestors are a luxury, Dina. We left in a hurry."*

**mint** — a green garden plant with a fresh, cool smell and taste. *"Mint grew where it wanted."*

**numb** — having no feeling, often from cold or from staying still too long. *"Sitting in the dark with her arm going numb."*

**oregano** — a green herb used to flavor food. *"that is not a weed, that is oregano."*

**pedal** — a part you press with your foot to make a machine work. *"Only Rosa's foot on the pedal changed its rhythm."*

**pie chart** — a circle split into colored slices to show parts of a whole. *"She watched her own life become a pie chart."*

**pinch** — to press and pull something off using two fingers. *"Pinch the small shoots off the tomatoes."*

**pinned** — fixed in place with a pin. Estreya arrived *"with a paper pinned inside her coat."*

**port** — a town by the sea where ships load, unload, and shelter. *"a port city on a strait."*

**potter** — a person who makes pots and dishes out of clay. *"Rosa had been a potter. Not as a hobby — as her life."*

**potter's wheel** — the flat spinning table a potter uses to shape clay. *"For forty years there was a potter's wheel in the back room."*

**shoots** — the small, new green parts that grow out of a plant. *"Pinch the small shoots."*

**small print** — the very small writing in a form or document, often the important part. *"Page after page of small print."*

**sponge** — a soft, holey object that soaks up water, used for cleaning. Estreya's job: *"She held the sponge."*

**stubborn** — refusing to change or give way. The fort has *"the strong stubborn shape of an old fort."*

**surgery** — a medical operation in which doctors cut into the body. *"It's spit, not surgery."*

**synagogue** — a building where Jewish people gather to pray. War had eaten *"the port's lists, the synagogue books, the city itself."*

**tile** — a flat, hard square used to cover floors, walls, or roofs. Her father made *"pots, tiles, jars for oil."*

**torch** — a stick that burns to give light (also a flashlight). She held the tube to the light *"like it was a torch."*

**vapor** — here, an old word (from the family's Spanish) for a steamboat. *"We had papers for one boat — one vapor — all six of us."*

**weed** — a wild plant growing where it is not wanted. *"that is not a weed, that is oregano."*

**wicker** — thin sticks woven together to make chairs and baskets. *"she sat in the wicker chair under the fig tree."*

**wire** — a thin thread of metal. The clay is cut *"with a wire held in two hands."*

**wobble** — to rock or shake unsteadily from side to side. *"It wobbled. It got wider. And then the whole thing fell over her fingers."*

**windowsill** — the flat shelf at the bottom of a window. *"On the kitchen windowsill there were two bowls."*

        // === Quiz Game Logic ===

        let quizOrder = [];
        let quizIndex = 0;
        let score = 0;
        let answered = false;

        const correctMessages = ["Great job!", "You got it!", "Wonderful!", "Exactly right!", "Well done!", "Perfect!"];
        const wrongMessages = ["Good try!", "Almost!", "Keep going!"];

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function escapeRegex(str) {
            return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function startQuiz() {
            quizOrder = shuffle([...Array(words.length).keys()]);
            quizIndex = 0;
            score = 0;
            answered = false;
            document.getElementById("quizEnd").style.display = "none";
            document.getElementById("quizGame").style.display = "block";
            showQuestion();
        }

        function showQuestion() {
            answered = false;
            const item = words[quizOrder[quizIndex]];
            const blankText = item.blank || item.word;
            const regex = new RegExp(escapeRegex(blankText), 'i');
            const sentenceHTML = item.quizSentence.replace(regex, '<span class="quiz-blank">_______</span>');

            document.getElementById("quizImage").src = item.quizImage;
            document.getElementById("quizImage").alt = "Hint image";
            document.getElementById("quizSentence").innerHTML = sentenceHTML;
            document.getElementById("quizFeedback").textContent = "";
            document.getElementById("quizFeedback").className = "quiz-feedback";
            document.getElementById("quizNextBtn").style.display = "none";
            document.getElementById("quizScore").textContent =
                score + " / " + (quizIndex) + " correct  ·  Question " + (quizIndex + 1) + " of " + words.length;

            // Pick 3 wrong options
            const wrongIndices = shuffle(
                [...Array(words.length).keys()].filter(i => i !== quizOrder[quizIndex])
            ).slice(0, 3);

            const options = shuffle([
                { text: item.word, correct: true },
                ...wrongIndices.map(i => ({ text: words[i].word, correct: false }))
            ]);

            const grid = document.getElementById("optionsGrid");
            grid.innerHTML = "";
            options.forEach(opt => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.textContent = opt.text;
                btn.addEventListener("click", function () {
                    if (answered) return;
                    selectAnswer(btn, opt.correct, item.word, grid);
                });
                grid.appendChild(btn);
            });
        }

        function selectAnswer(selectedBtn, isCorrect, correctWord, grid) {
            answered = true;
            const allBtns = grid.querySelectorAll(".option-btn");

            allBtns.forEach(btn => {
                btn.classList.add("disabled");
                if (btn.textContent === correctWord) {
                    btn.classList.add("correct");
                }
            });

            const feedback = document.getElementById("quizFeedback");
            if (isCorrect) {
                score++;
                feedback.textContent = correctMessages[Math.floor(Math.random() * correctMessages.length)];
                feedback.className = "quiz-feedback correct";
            } else {
                selectedBtn.classList.add("wrong");
                feedback.textContent = wrongMessages[Math.floor(Math.random() * wrongMessages.length)] +
                    " The answer is: " + correctWord;
                feedback.className = "quiz-feedback wrong";
            }

            document.getElementById("quizScore").textContent =
                score + " / " + (quizIndex + 1) + " correct  ·  Question " + (quizIndex + 1) + " of " + words.length;
            document.getElementById("quizNextBtn").style.display = "block";
        }

        document.getElementById("quizNextBtn").addEventListener("click", function () {
            quizIndex++;
            if (quizIndex >= words.length) {
                showEndScreen();
            } else {
                showQuestion();
            }

        // Parse a single markdown file (## headings = chapters) into a story object.
        // Each chapter becomes one scrolling page. Any text before the first chapter
        // (e.g. a dedication) becomes an opening "Dedication" page.
        function parseChapteredStory(md, fallbackTitle) {
            var lines = md.replace(/\r\n/g, "\n").split("\n");
            var title = fallbackTitle || "Story";
            var titleFound = false;
            var chapters = [];
            var current = null;
            var preamble = [];

            lines.forEach(function (line) {
                var h2 = line.match(/^##\s+(.+?)\s*$/);
                var h1 = line.match(/^#\s+(.+?)\s*$/);
                if (h2) {
                    if (current) chapters.push(current);
                    current = { title: h2[1].trim(), body: [] };
                } else if (h1 && !current && !titleFound) {
                    title = h1[1].trim();
                    titleFound = true;
                } else if (current) {
                    current.body.push(line);
                } else {
                    preamble.push(line);
                }
            });
            if (current) chapters.push(current);

            function clean(arr) {
                var text = arr.join("\n").replace(/\n{3,}/g, "\n\n").trim();
                // drop leading/trailing horizontal rules so a page never opens/ends on one
                text = text.replace(/^(\s*(?:-{3,}|\*{3,})\s*\n)+/, "");
                text = text.replace(/(\n\s*(?:-{3,}|\*{3,})\s*)+$/, "");
                return text.trim();
            }

            var result = [];
            var pre = clean(preamble);
            if (pre) result.push({ title: "Dedication", pages: [pre] });
            chapters.forEach(function (ch) {
                result.push({ title: ch.title, pages: [clean(ch.body)] });
            });
            return { title: title, chapters: result };
        }

        // Parse a glossary markdown file (lines of "**term** — meaning") into
        // { entries:[{term, meaningHtml}], formMap:{ surfaceForm -> entryIndex },
        //   regex } so hard words can be matched (with light inflections) in the
        // story text and tapped for an in-context definition.
        function parseGlossary(md) {
            function gInline(text) {
                return text
                    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
                    .replace(/\*([^*]+)\*/g, "<em>$1</em>");
            }
            function variants(base) {
                var b = base.toLowerCase();
                var out = [b, b + "s"];
                var last = b.charAt(b.length - 1);
                if (last === "e") {
                    var st = b.slice(0, -1);
                    out.push(st + "ed", st + "ing");
                } else if (last === "y" && b.length > 2) {
                    var yy = b.slice(0, -1);
                    out.push(yy + "ies", yy + "ied");
                } else if (b.length >= 5) {
                    out.push(b + "es", b + "ed", b + "ing");
                }
                return out;
            }

            var entries = [];
            var formMap = Object.create(null);
            var allForms = [];
            function addForm(form, idx) {
                form = form.toLowerCase();
                if (!form || form in formMap) return;
                formMap[form] = idx;
                allForms.push(form);
            }

            md.replace(/\r\n/g, "\n").split("\n").forEach(function (line) {
                var m = line.match(/^\s*(?:[-*]\s+)?\*\*(.+?)\*\*\s*[–—-]\s*(.+?)\s*$/);
                if (!m) return;
                var termRaw = m[1].trim();
                var idx = entries.length;
                entries.push({ term: termRaw, meaningHtml: gInline(m[2].trim()) });
                termRaw.split("/").forEach(function (part) {
                    var clean = part.replace(/\([^)]*\)/g, " ").replace(/\s+/g, " ").trim();
                    if (!clean) return;
                    if (/[\s-]/.test(clean)) {
                        addForm(clean, idx); // phrase / hyphenated: match verbatim
                    } else {
                        variants(clean).forEach(function (f) { addForm(f, idx); });
                    }
                });
            });

            allForms.sort(function (a, b) { return b.length - a.length; });
            var escaped = allForms.map(function (f) {
                return f.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            });
            var regex = escaped.length
                ? new RegExp("\\b(?:" + escaped.join("|") + ")\\b", "gi")
                : null;
            return { entries: entries, formMap: formMap, regex: regex };
        }
