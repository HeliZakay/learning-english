<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My English Words</title>
    <!-- Puter.js (Story text-to-speech) — disabled because it errors when opening the file directly (file://). Re-enable by uncommenting and serving via a local web server. -->
    <!-- <script src="https://js.puter.com/v2/"></script> -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #E0E7FF 0%, #C7D2FE 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        h1 {
            color: #3730A3;
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 24px;
            text-align: center;
        }

        .card-container {
            width: 100%;
            max-width: 400px;
        }

        .card {
            background: #FFFFFF;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(79, 70, 229, 0.15);
            padding: 32px 28px;
            text-align: center;
            height: auto;
            display: flex;
            flex-direction: column;
        }

        .card-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 16px;
            margin-bottom: 28px;
            object-fit: cover;
        }

        .word {
            font-size: 2.5rem;
            font-weight: 800;
            color: #4338CA;
            margin-bottom: 16px;
            line-height: 1.2;
        }

        .sentence {
            font-size: 1.3rem;
            color: #4B5563;
            line-height: 1.5;
            padding: 0 4px;
            flex: 1;
        }

        .progress {
            margin-top: 24px;
            font-size: 1.1rem;
            color: #6366F1;
            font-weight: 600;
        }

        .btn-row {
            margin-top: 28px;
            width: 100%;
            max-width: 400px;
            display: flex;
            gap: 12px;
        }

        .nav-btn {
            flex: 1;
            padding: 18px 32px;
            font-size: 1.4rem;
            font-weight: 700;
            color: #FFFFFF;
            background: linear-gradient(135deg, #6366F1, #4F46E5);
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 4px 16px rgba(79, 70, 229, 0.3);
            -webkit-tap-highlight-color: transparent;
        }

        .nav-btn:active {
            transform: scale(0.97);
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.3);
        }

        /* Mode Toggle */
        .mode-toggle {
            display: flex;
            background: rgba(99, 102, 241, 0.15);
            border-radius: 14px;
            padding: 4px;
            margin-bottom: 24px;
            gap: 4px;
        }

        .mode-btn {
            flex: 1;
            padding: 12px 10px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 11px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            background: transparent;
            color: #6366F1;
            -webkit-tap-highlight-color: transparent;
        }

        .mode-btn.active {
            background: #FFFFFF;
            color: #4338CA;
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.15);
        }

        /* Quiz Styles */
        .quiz-container {
            width: 100%;
            max-width: 400px;
            display: none;
        }

        .quiz-card {
            background: #FFFFFF;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(79, 70, 229, 0.15);
            padding: 32px 28px;
            text-align: center;
        }

        .quiz-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 16px;
            margin-bottom: 24px;
            object-fit: cover;
        }

        .quiz-sentence {
            font-size: 1.3rem;
            color: #4B5563;
            line-height: 1.6;
            margin-bottom: 24px;
            padding: 0 4px;
        }

        .quiz-blank {
            display: inline-block;
            min-width: 80px;
            border-bottom: 3px solid #6366F1;
            color: #6366F1;
            font-weight: 700;
            padding: 0 4px;
            margin: 0 2px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            padding: 14px 12px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #4338CA;
            background: #FFFFFF;
            border: 2.5px solid #C7D2FE;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.12s, border-color 0.15s, background 0.15s;
            -webkit-tap-highlight-color: transparent;
            word-break: break-word;
        }

        .option-btn:active:not(.disabled) {
            transform: scale(0.96);
        }

        .option-btn.correct {
            background: #D1FAE5;
            border-color: #34D399;
            color: #065F46;
        }

        .option-btn.wrong {
            background: #FEE2E2;
            border-color: #F87171;
            color: #991B1B;
        }

        .option-btn.disabled {
            cursor: default;
            opacity: 0.7;
        }

        .option-btn.disabled.correct {
            opacity: 1;
        }

        .quiz-feedback {
            font-size: 1.2rem;
            font-weight: 700;
            min-height: 1.5em;
            margin-bottom: 16px;
        }

        .quiz-feedback.correct {
            color: #059669;
        }

        .quiz-feedback.wrong {
            color: #DC2626;
        }

        .quiz-next-btn {
            display: none;
            width: 100%;
            padding: 16px;
            font-size: 1.3rem;
            font-weight: 700;
            color: #FFFFFF;
            background: linear-gradient(135deg, #6366F1, #4F46E5);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.15s;
            box-shadow: 0 4px 16px rgba(79, 70, 229, 0.3);
            -webkit-tap-highlight-color: transparent;
            margin-bottom: 16px;
        }

        .quiz-next-btn:active {
            transform: scale(0.97);
        }

        .quiz-score {
            font-size: 1rem;
            color: #6366F1;
            font-weight: 600;
        }

        /* End screen */
        .quiz-end {
            display: none;
            text-align: center;
            padding: 20px 0;
        }

        .quiz-end .end-emoji {
            font-size: 4rem;
            margin-bottom: 16px;
        }

        .quiz-end .end-score {
            font-size: 1.8rem;
            font-weight: 800;
            color: #4338CA;
            margin-bottom: 8px;
        }

        .quiz-end .end-message {
            font-size: 1.2rem;
            color: #4B5563;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        /* === Story Reader Styles === */

        .story-container {
            width: 100%;
            max-width: 400px;
            display: none;
        }

        .story-card {
            background: #FFFFFF;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(79, 70, 229, 0.15);
            padding: 32px 24px;
        }

        .story-toc-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #4338CA;
            text-align: center;
            margin-bottom: 4px;
        }


        .story-toc-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .story-toc-item {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            padding: 18px 20px;
            font-size: 1.25rem;
            font-weight: 600;
            color: #4338CA;
            background: #F0EDFF;
            border: 2.5px solid #C7D2FE;
            border-radius: 16px;
            cursor: pointer;
            text-align: left;
            transition: transform 0.12s, background 0.15s;
            -webkit-tap-highlight-color: transparent;
        }

        .story-toc-item:active {
            transform: scale(0.97);
            background: #E0DDFF;
        }

        .story-toc-item-number {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366F1, #4F46E5);
            color: #FFFFFF;
            font-size: 1.2rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .story-toc-item-title {
            flex: 1;
        }

        /* Chapter Reader */
        .story-header {
            border-bottom: 2px solid #E0E7FF;
            padding-bottom: 14px;
            margin-bottom: 20px;
        }

        .story-chapter-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: #4338CA;
            margin-bottom: 6px;
        }

        .story-page-indicator {
            font-size: 1.1rem;
            font-weight: 600;
            color: #6366F1;
        }

        .story-progress-bar {
            width: 100%;
            height: 6px;
            background: #E0E7FF;
            border-radius: 3px;
            margin-top: 10px;
            overflow: hidden;
        }

        .story-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #6366F1, #4F46E5);
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .story-page-content {
            font-size: 1.5rem;
            color: #1F2937;
            line-height: 1.8;
            min-height: 200px;
            padding: 8px 0;
        }

        .story-page-content p {
            margin-bottom: 16px;
        }

        .story-nav {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .story-main-btn {
            width: 100%;
            padding: 20px;
            font-size: 1.4rem;
            font-weight: 700;
            color: #FFFFFF;
            background: linear-gradient(135deg, #6366F1, #4F46E5);
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 4px 16px rgba(79, 70, 229, 0.3);
            -webkit-tap-highlight-color: transparent;
        }

        .story-main-btn:active {
            transform: scale(0.97);
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.3);
        }

        .story-back-page-btn {
            width: 100%;
            padding: 14px;
            font-size: 1.15rem;
            font-weight: 600;
            color: #6366F1;
            background: #F0EDFF;
            border: 2px solid #C7D2FE;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.12s;
            -webkit-tap-highlight-color: transparent;
        }

        .story-back-page-btn:active {
            transform: scale(0.97);
        }

        .story-back-page-btn.hidden {
            display: none;
        }

        .story-toc-btn {
            display: block;
            width: 100%;
            margin-top: 16px;
            padding: 16px;
            font-size: 1.2rem;
            font-weight: 700;
            color: #4338CA;
            background: rgba(255, 255, 255, 0.8);
            border: 2.5px solid #C7D2FE;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.12s;
            -webkit-tap-highlight-color: transparent;
            text-align: center;
        }

        .story-toc-btn:active {
            transform: scale(0.97);
        }

        /* TTS Controls */
        .tts-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tts-play-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 20px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #4338CA;
            background: #F0EDFF;
            border: 2px solid #C7D2FE;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.12s, background 0.15s, color 0.15s;
            -webkit-tap-highlight-color: transparent;
        }

        .tts-play-btn:active {
            transform: scale(0.97);
        }

        .tts-play-btn.loading {
            color: #6366F1;
            cursor: wait;
        }

        .tts-play-btn.playing {
            color: #FFFFFF;
            background: linear-gradient(135deg, #6366F1, #4F46E5);
            border-color: #4F46E5;
        }

        .tts-play-btn.error {
            color: #991B1B;
            background: #FEE2E2;
            border-color: #F87171;
        }

        .tts-play-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .tts-icon.spinning {
            display: inline-block;
            animation: tts-spin 1s linear infinite;
        }

        @keyframes tts-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .tts-settings-btn {
            width: 48px;
            font-size: 1.3rem;
            color: #6366F1;
            background: #F0EDFF;
            border: 2px solid #C7D2FE;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.12s;
            -webkit-tap-highlight-color: transparent;
            flex-shrink: 0;
        }

        .tts-settings-btn:active {
            transform: scale(0.97);
        }

        .tts-settings-btn.active {
            background: #6366F1;
            color: #FFFFFF;
            border-color: #4F46E5;
        }

        .tts-settings-panel {
            background: #F8F7FF;
            border: 2px solid #C7D2FE;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .tts-settings-header {
            font-size: 1rem;
            font-weight: 700;
            color: #4338CA;
            margin-bottom: 12px;
        }

        .tts-field {
            margin-bottom: 12px;
        }

        .tts-field label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #4338CA;
            margin-bottom: 4px;
        }

        .tts-field select,
        .tts-field input {
            width: 100%;
            padding: 8px 12px;
            font-size: 0.95rem;
            border: 2px solid #C7D2FE;
            border-radius: 10px;
            background: #FFFFFF;
            color: #1E1B4B;
            box-sizing: border-box;
        }

        .tts-voice-presets {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }

        .tts-voice-chip {
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #4338CA;
            background: #FFFFFF;
            border: 2px solid #C7D2FE;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }

        .tts-voice-chip.active {
            background: #6366F1;
            color: #FFFFFF;
            border-color: #4F46E5;
        }

        .tts-preview-btn {
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #4338CA;
            background: #E0E7FF;
            border: 2px solid #C7D2FE;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.12s;
        }

        .tts-preview-btn:active {
            transform: scale(0.97);
        }

        .tts-notification {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 16px;
            animation: tts-slide-in 0.3s ease;
        }

        .tts-notification.warning {
            background: #FEF3C7;
            border: 2px solid #F59E0B;
            color: #92400E;
        }

        .tts-notification.error {
            background: #FEE2E2;
            border: 2px solid #F87171;
            color: #991B1B;
        }

        @keyframes tts-slide-in {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <h1>My English Words</h1>

    <div class="mode-toggle">
        <button class="mode-btn active" id="flashcardsTab">Flashcards 1</button>
        <button class="mode-btn" id="quizTab">Quiz 1</button>
        <button class="mode-btn" id="flashcards2Tab">Flashcards 2</button>
        <button class="mode-btn" id="quiz2Tab">Quiz 2</button>
        <button class="mode-btn" id="storyTab">Story</button>
    </div>

    <div class="card-container">
        <div class="card">
            <img class="card-image" id="cardImage" src="" alt="">
            <div class="word" id="word"></div>
            <div class="sentence" id="sentence"></div>
        </div>
    </div>

    <div class="progress" id="progress"></div>

    <div class="btn-row">
        <button class="nav-btn" id="backBtn">← Back</button>
        <button class="nav-btn" id="nextBtn">Next →</button>
    </div>

    <!-- Quiz Game -->
    <div class="quiz-container" id="quizContainer">
        <div class="quiz-card">
            <div id="quizGame">
                <img class="quiz-image" id="quizImage" src="" alt="">
                <div class="quiz-sentence" id="quizSentence"></div>
                <div class="options-grid" id="optionsGrid"></div>
                <div class="quiz-feedback" id="quizFeedback"></div>
                <button class="quiz-next-btn" id="quizNextBtn">Next Question →</button>
                <div class="quiz-score" id="quizScore"></div>
            </div>
            <div class="quiz-end" id="quizEnd">
                <div class="end-emoji" id="endEmoji"></div>
                <div class="end-score" id="endScore"></div>
                <div class="end-message" id="endMessage"></div>
                <button class="quiz-next-btn" style="display:block" id="playAgainBtn">Play Again</button>
            </div>
        </div>
    </div>

    <!-- Story Reader -->
    <div class="story-container" id="storyContainer">

        <!-- Table of Contents View -->
        <div class="story-toc" id="storyToc">
            <div class="story-card">
                <div class="story-toc-title" id="storyTitle">The Letters We Never Sent</div>
                <div class="story-toc-list" id="storyTocList"></div>
            </div>
        </div>

        <!-- Chapter Reading View -->
        <div class="story-reader" id="storyReader" style="display:none">
            <div class="story-card">
                <div class="story-header">
                    <div class="story-chapter-title" id="storyChapterTitle"></div>
                    <div class="story-page-indicator" id="storyPageIndicator"></div>
                    <div class="story-progress-bar">
                        <div class="story-progress-fill" id="storyProgressFill"></div>
                    </div>
                </div>
                <div class="tts-controls" id="ttsControls">
                    <button class="tts-play-btn" id="ttsPlayBtn">
                        <span class="tts-icon" id="ttsIcon">&#9654;</span>
                        <span class="tts-label" id="ttsLabel">Listen to this page</span>
                    </button>
                    <button class="tts-settings-btn" id="ttsSettingsBtn" title="Voice Settings">&#9881;</button>
                </div>
                <div class="tts-settings-panel" id="ttsSettingsPanel" style="display:none">
                    <div class="tts-settings-header">Voice Settings</div>
                    <div class="tts-field">
                        <label for="ttsModel">Model</label>
                        <select id="ttsModel">
                            <option value="eleven_multilingual_v2">Multilingual v2</option>
                            <option value="eleven_flash_v2_5">Flash v2.5 (faster)</option>
                            <option value="eleven_turbo_v2_5">Turbo v2.5 (fastest)</option>
                            <option value="eleven_v3">v3 (latest)</option>
                        </select>
                    </div>
                    <div class="tts-field">
                        <label>Voice Presets</label>
                        <div class="tts-voice-presets" id="ttsVoicePresets"></div>
                    </div>
                    <div class="tts-field">
                        <label for="ttsVoiceId">Custom Voice ID</label>
                        <input type="text" id="ttsVoiceId" placeholder="Paste an ElevenLabs voice ID">
                    </div>
                    <button class="tts-preview-btn" id="ttsPreviewBtn">Preview Voice</button>
                </div>
                <div id="ttsNotificationArea"></div>
                <div class="story-page-content" id="storyPageContent"></div>
                <div class="story-nav">
                    <button class="story-back-page-btn hidden" id="storyPrevPageBtn">← Previous Page</button>
                    <button class="story-main-btn" id="storyNextPageBtn">Next Page →</button>
                </div>
            </div>
            <button class="story-toc-btn" id="storyBackToTocBtn">☰ Table of Contents</button>
        </div>
    </div>

    <script>
        const words1 = [
            { word: "Drizzle", sentence: "Take an umbrella — there is a light drizzle outside.", quizSentence: "We went for a walk in the drizzle and got a little wet.", image: "images/drizzle.png", quizImage: "https://images.unsplash.com/photo-1523889739556-7d3a75db3e35?w=400&fit=crop" },
            { word: "Intermittent", sentence: "The Wi-Fi signal was intermittent — it kept cutting out and coming back.", quizSentence: "The rain was intermittent — it stopped and started all afternoon.", image: "images/intermittent.png", quizImage: "https://images.unsplash.com/photo-1515694346937-94d85e41e6f0?w=400&fit=crop" },
            { word: "Likely", sentence: "She is likely to get the job — her interview went very well.", quizSentence: "It is likely to rain tomorrow, so bring a jacket.", image: "images/likely.png", quizImage: "https://images.unsplash.com/photo-1762328493889-516b52b3aa7d?w=400&fit=crop" },
            { word: "Shortchange", sentence: "The cashier tried to shortchange me by giving back less money.", quizSentence: "Always count your coins — you don't want anyone to shortchange you.", image: "images/shortchange.png", quizImage: "https://images.unsplash.com/photo-1503688891477-6cdfff1f7b53?w=400&fit=crop" },
            { word: "Settle", sentence: "After years of traveling, she decided to settle in a quiet town.", quizSentence: "They want to settle in the countryside and start a new life.", image: "images/settle.png", quizImage: "https://images.unsplash.com/photo-1574780986957-74f4ee225b87?w=400&fit=crop" },
            { word: "Rose-tinted", sentence: "He sees the past through rose-tinted glasses, as if everything was perfect.", quizSentence: "She looks at her school days through rose-tinted glasses, forgetting the hard parts.", image: "images/rose-tinted.png", quizImage: "https://images.unsplash.com/photo-1533158307587-828f0a76ef46?w=400&fit=crop", blank: "rose-tinted" },

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function escapeRegex(str) {
            return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function startQuiz() {
            quizOrder = shuffle([...Array(words.length).keys()]);
            quizIndex = 0;
            score = 0;
            answered = false;
            document.getElementById("quizEnd").style.display = "none";
            document.getElementById("quizGame").style.display = "block";
            showQuestion();
        }

        function showQuestion() {
            answered = false;
            const item = words[quizOrder[quizIndex]];
            const blankText = item.blank || item.word;
            const regex = new RegExp(escapeRegex(blankText), 'i');
            const sentenceHTML = item.quizSentence.replace(regex, '<span class="quiz-blank">_______</span>');

            document.getElementById("quizImage").src = item.quizImage;
            document.getElementById("quizImage").alt = "Hint image";
            document.getElementById("quizSentence").innerHTML = sentenceHTML;
            document.getElementById("quizFeedback").textContent = "";
            document.getElementById("quizFeedback").className = "quiz-feedback";
            document.getElementById("quizNextBtn").style.display = "none";
            document.getElementById("quizScore").textContent =
                score + " / " + (quizIndex) + " correct  ·  Question " + (quizIndex + 1) + " of " + words.length;

            // Pick 3 wrong options
            const wrongIndices = shuffle(
                [...Array(words.length).keys()].filter(i => i !== quizOrder[quizIndex])
            ).slice(0, 3);

            const options = shuffle([
                { text: item.word, correct: true },
                ...wrongIndices.map(i => ({ text: words[i].word, correct: false }))
            ]);

            const grid = document.getElementById("optionsGrid");
            grid.innerHTML = "";
            options.forEach(opt => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.textContent = opt.text;
                btn.addEventListener("click", function () {
                    if (answered) return;
                    selectAnswer(btn, opt.correct, item.word, grid);
                });
                grid.appendChild(btn);
            });
        }

        function selectAnswer(selectedBtn, isCorrect, correctWord, grid) {
            answered = true;
            const allBtns = grid.querySelectorAll(".option-btn");

            allBtns.forEach(btn => {
                btn.classList.add("disabled");
                if (btn.textContent === correctWord) {
                    btn.classList.add("correct");
                }
            });

            const feedback = document.getElementById("quizFeedback");
            if (isCorrect) {
                score++;
                feedback.textContent = correctMessages[Math.floor(Math.random() * correctMessages.length)];
                feedback.className = "quiz-feedback correct";
            } else {
                selectedBtn.classList.add("wrong");
                feedback.textContent = wrongMessages[Math.floor(Math.random() * wrongMessages.length)] +
                    " The answer is: " + correctWord;
                feedback.className = "quiz-feedback wrong";
            }

            document.getElementById("quizScore").textContent =
                score + " / " + (quizIndex + 1) + " correct  ·  Question " + (quizIndex + 1) + " of " + words.length;
            document.getElementById("quizNextBtn").style.display = "block";
        }

        document.getElementById("quizNextBtn").addEventListener("click", function () {
            quizIndex++;
            if (quizIndex >= words.length) {

            } else {

            }
        });

        function ttsSplitText(text) {
            text = text.replace(/\*(.*?)\*/g, "$1");
            if (text.length <= 2800) return [text];
            var chunks = [];
            var remaining = text;
            while (remaining.length > 0) {
                if (remaining.length <= 2800) {
                    chunks.push(remaining);
                    break;
                }
                var slice = remaining.substring(0, 2800);
                var splitAt = slice.lastIndexOf(". ");
                if (splitAt === -1) splitAt = slice.lastIndexOf(".\n");
                if (splitAt === -1) splitAt = slice.lastIndexOf(" ");
                if (splitAt === -1) splitAt = 2800;
                else splitAt += 1;
                chunks.push(remaining.substring(0, splitAt).trim());
                remaining = remaining.substring(splitAt).trim();
            }
            return chunks;
        }

            if (ttsState.audio) {
                ttsState.audio.pause();
                ttsState.audio.currentTime = 0;
                ttsState.audio.onended = null;
                ttsState.audio = null;
            }
            ttsState.status = "idle";
            ttsState.chunks = [];
            ttsState.currentChunk = 0;
            ttsUpdateUI();
        }

        function ttsPlayChunk(index) {
            if (index >= ttsState.chunks.length) {
                ttsState.status = "idle";
                ttsState.audio = null;
                ttsUpdateUI();
                return;
            }
            ttsState.currentChunk = index;

            var timeoutId = setTimeout(function () {
                if (ttsState.status === "loading") {
                    ttsStop();
                    showTtsNotification("Audio loading timed out. Please try again.", "error", 5000);
                }
            }, 30000);

            puter.ai.txt2speech(ttsState.chunks[index], {
                provider: "elevenlabs",
                voice: ttsState.voiceId,
                model: ttsState.model
            }).then(function (audio) {
                clearTimeout(timeoutId);
                if (ttsState.status !== "loading" && ttsState.status !== "playing") return;
                ttsState.audio = audio;
                ttsState.status = "playing";
                ttsUpdateUI();
                audio.onended = function () {
                    ttsPlayChunk(index + 1);
                };
                audio.play();
            }).catch(function (err) {
                clearTimeout(timeoutId);
                handleTtsError(err);
            });
        }

        function ttsPlay() {
            if (ttsState.status === "loading" || ttsState.status === "playing") {
                ttsStop();
                return;
            }

            if (typeof puter === "undefined" || !puter.ai) {
                showTtsNotification("Text-to-speech is not available. Puter.js failed to load.", "error", 5000);
                return;
            }

            var rateLimitDate = localStorage.getItem("tts_rate_limit_date");
            if (rateLimitDate) {
                var now = new Date();
                var limitDate = new Date(rateLimitDate);
                var renewDate = new Date(limitDate.getFullYear(), limitDate.getMonth() + 1, 1);
                if (now < renewDate) {
                    showTtsNotification(
                        "Monthly audio credits are used up. Credits renew on " +
                        renewDate.toLocaleDateString("en-US", { month: "long", day: "numeric" }) + ".",
                        "warning", 8000
                    );
                    return;
                } else {
                    localStorage.removeItem("tts_rate_limit_date");
                }
            }

            var pageText = storyData.chapters[storyChapter].pages[storyPage];
            ttsState.chunks = ttsSplitText(pageText);
            ttsState.status = "loading";
            ttsUpdateUI();
            ttsPlayChunk(0);
        }

        function handleTtsError(err) {
            ttsState.status = "error";
            ttsState.audio = null;
            ttsUpdateUI();

            var isRateLimit = false;
            if (err) {
                var errStr = (typeof err === "string") ? err : JSON.stringify(err);
                if (err.status === 429 || errStr.indexOf("rate_limit") !== -1 ||
                    errStr.indexOf("quota") !== -1 || errStr.indexOf("limit") !== -1) {
                    isRateLimit = true;
                }
            }

            if (isRateLimit) {
                localStorage.setItem("tts_rate_limit_date", new Date().toISOString());
                var renewDate = new Date();
                renewDate = new Date(renewDate.getFullYear(), renewDate.getMonth() + 1, 1);
                showTtsNotification(
                    "Monthly audio credits are used up. Free tier includes about 10 minutes per month. " +
                    "Credits renew on " + renewDate.toLocaleDateString("en-US", { month: "long", day: "numeric" }) + ".",
                    "warning", 10000
                );
            } else {
                showTtsNotification("Could not load audio. Please try again.", "error", 5000);
            }

            setTimeout(function () {
                if (ttsState.status === "error") {
                    ttsState.status = "idle";
                    ttsUpdateUI();
                }
            }, 3000);
        }

        function showTtsNotification(message, type, duration) {
            var area = document.getElementById("ttsNotificationArea");
            area.innerHTML = "";
            var el = document.createElement("div");
            el.className = "tts-notification " + type;
            el.textContent = message;
            area.appendChild(el);
            setTimeout(function () {
                if (el.parentNode) el.parentNode.removeChild(el);
            }, duration || 5000);
        }

        // Voice presets
        (function initTtsSettings() {
            var presetsContainer = document.getElementById("ttsVoicePresets");
            voicePresets.forEach(function (preset) {
                var chip = document.createElement("button");
                chip.className = "tts-voice-chip" + (ttsState.voiceId === preset.id ? " active" : "");
                chip.textContent = preset.name;
                chip.setAttribute("data-voice-id", preset.id);
                chip.addEventListener("click", function () {
                    ttsState.voiceId = preset.id;
                    localStorage.setItem("tts_voice_id", preset.id);
                    document.getElementById("ttsVoiceId").value = "";
                    presetsContainer.querySelectorAll(".tts-voice-chip").forEach(function (c) {
                        c.classList.remove("active");
                    });
                    chip.classList.add("active");
                });
                presetsContainer.appendChild(chip);
            });

            var modelSelect = document.getElementById("ttsModel");
            modelSelect.value = ttsState.model;
            modelSelect.addEventListener("change", function () {
                ttsState.model = modelSelect.value;
                localStorage.setItem("tts_model", modelSelect.value);
            });

            var voiceIdInput = document.getElementById("ttsVoiceId");
            voiceIdInput.addEventListener("change", function () {
                var val = voiceIdInput.value.trim();
                if (val) {
                    ttsState.voiceId = val;
                    localStorage.setItem("tts_voice_id", val);
                    presetsContainer.querySelectorAll(".tts-voice-chip").forEach(function (c) {
                        c.classList.remove("active");
                    });
                }
            });
        })();

        // TTS button events
        document.getElementById("ttsPlayBtn").addEventListener("click", ttsPlay);

        document.getElementById("ttsSettingsBtn").addEventListener("click", function () {
            var panel = document.getElementById("ttsSettingsPanel");
            var btn = document.getElementById("ttsSettingsBtn");
            if (panel.style.display === "none") {
                panel.style.display = "block";
                btn.classList.add("active");
            } else {
                panel.style.display = "none";
                btn.classList.remove("active");
            }
        });

        document.getElementById("ttsPreviewBtn").addEventListener("click", function () {
            if (typeof puter === "undefined" || !puter.ai) {
                showTtsNotification("Puter.js not loaded.", "error", 3000);
                return;
            }
            var previewBtn = document.getElementById("ttsPreviewBtn");
            previewBtn.textContent = "Loading...";
            puter.ai.txt2speech("Hello! This is a preview of the selected voice. The story will sound like this.", {
                provider: "elevenlabs",
                voice: ttsState.voiceId,
                model: ttsState.model
            }).then(function (audio) {
                previewBtn.textContent = "Preview Voice";
                audio.play();
            }).catch(function (err) {
                previewBtn.textContent = "Preview Voice";
                handleTtsError(err);
            });
        });
    </script>
</body>
</html>
