<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My English Words</title>
    <!-- Puter.js (Story text-to-speech) — disabled because it errors when opening the file directly (file://). Re-enable by uncommenting and serving via a local web server. -->
    <!-- <script src="https://js.puter.com/v2/"></script> -->
    <link rel="stylesheet" href="css/talk.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #E0E7FF 0%, #C7D2FE 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        h1 {
            color: #3730A3;
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 24px;
            text-align: center;
        }

        .card-container {
            width: 100%;
            max-width: 400px;
        }

        .card {
            background: #FFFFFF;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(79, 70, 229, 0.15);
            padding: 32px 28px;
            text-align: center;
            height: auto;
            display: flex;
            flex-direction: column;
        }

        .card-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 16px;
            margin-bottom: 28px;
            object-fit: cover;
        }

        .word {
            font-size: 2.5rem;
            font-weight: 800;
            color: #4338CA;
            margin-bottom: 16px;
            line-height: 1.2;
        }

        .sentence {
            font-size: 1.3rem;
            color: #4B5563;
            line-height: 1.5;
            padding: 0 4px;
            flex: 1;
        }

        .progress {
            margin-top: 24px;
            font-size: 1.1rem;
            color: #6366F1;
            font-weight: 600;
        }

        .btn-row {
            margin-top: 28px;
            width: 100%;
            max-width: 400px;
            display: flex;
            gap: 12px;
        }

        .nav-btn {
            flex: 1;
            padding: 18px 32px;
            font-size: 1.4rem;
            font-weight: 700;
            color: #FFFFFF;
            background: linear-gradient(135deg, #6366F1, #4F46E5);
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 4px 16px rgba(79, 70, 229, 0.3);
            -webkit-tap-highlight-color: transparent;
        }

        .nav-btn:active {
            transform: scale(0.97);
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.3);
        }

        /* Mode Toggle */
        .menu-wrap {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin-bottom: 24px;
        }

        .hamburger {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 12px 16px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            background: rgba(99, 102, 241, 0.15);
            color: #4338CA;
            -webkit-tap-highlight-color: transparent;
        }

        .hamburger-icon {
            font-size: 1.3rem;
            line-height: 1;
        }

        .hamburger-label {
            font-weight: 700;
        }

        .mode-toggle {
            display: none;
            flex-direction: column;
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: #FFFFFF;
            border-radius: 14px;
            padding: 6px;
            gap: 4px;
            box-shadow: 0 8px 24px rgba(79, 70, 229, 0.2);
            z-index: 10;
        }

        .mode-toggle.open {
            display: flex;
        }

        .mode-btn {
            text-align: left;
            padding: 12px 14px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 11px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            background: transparent;
            color: #6366F1;
            -webkit-tap-highlight-color: transparent;
        }

        .mode-btn.active {
            background: rgba(99, 102, 241, 0.12);
            color: #4338CA;
        }

        /* Quiz Styles */
        .quiz-container {
            width: 100%;
            max-width: 400px;
            display: none;
        }

        .quiz-card {
            background: #FFFFFF;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(79, 70, 229, 0.15);
            padding: 32px 28px;
            text-align: center;
        }

        .quiz-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 16px;
            margin-bottom: 24px;
            object-fit: cover;
        }

        .quiz-sentence {
            font-size: 1.3rem;
            color: #4B5563;
            line-height: 1.6;
            margin-bottom: 24px;
            padding: 0 4px;
        }

        .quiz-blank {
            display: inline-block;
            min-width: 80px;
            border-bottom: 3px solid #6366F1;
            color: #6366F1;
            font-weight: 700;
            padding: 0 4px;
            margin: 0 2px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            padding: 14px 12px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #4338CA;
            background: #FFFFFF;
            border: 2.5px solid #C7D2FE;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.12s, border-color 0.15s, background 0.15s;
            -webkit-tap-highlight-color: transparent;
            word-break: break-word;
        }

        .option-btn:active:not(.disabled) {
            transform: scale(0.96);
        }

        .option-btn.correct {
            background: #D1FAE5;
            border-color: #34D399;
            color: #065F46;
        }

        .option-btn.wrong {
            background: #FEE2E2;
            border-color: #F87171;
            color: #991B1B;
        }

        .option-btn.disabled {
            cursor: default;
            opacity: 0.7;
        }

        .option-btn.disabled.correct {
            opacity: 1;
        }

        .quiz-feedback {
            font-size: 1.2rem;
            font-weight: 700;
            min-height: 1.5em;
            margin-bottom: 16px;
        }

        .quiz-feedback.correct {
            color: #059669;
        }

        .quiz-feedback.wrong {
            color: #DC2626;
        }

        .quiz-next-btn {
            display: none;
            width: 100%;
            padding: 16px;
            font-size: 1.3rem;
            font-weight: 700;
            color: #FFFFFF;
            background: linear-gradient(135deg, #6366F1, #4F46E5);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.15s;
            box-shadow: 0 4px 16px rgba(79, 70, 229, 0.3);
            -webkit-tap-highlight-color: transparent;
            margin-bottom: 16px;
        }

        .quiz-next-btn:active {
            transform: scale(0.97);
        }

        .quiz-score {
            font-size: 1rem;
            color: #6366F1;
            font-weight: 600;
        }

        /* Type Quiz */
        .type-input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px 16px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #4338CA;
            text-align: center;
            background: #FFFFFF;
            border: 2.5px solid #C7D2FE;
            border-radius: 14px;
            margin-bottom: 16px;
            transition: border-color 0.15s, box-shadow 0.15s;
            -webkit-tap-highlight-color: transparent;
        }

        .type-input:focus {
            outline: none;
            border-color: #6366F1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .type-input.correct {
            background: #D1FAE5;
            border-color: #34D399;
            color: #065F46;
        }

        .type-input.wrong {
            background: #FEE2E2;
            border-color: #F87171;
            color: #991B1B;
        }

        .type-hint-display {
            font-family: "Courier New", monospace;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #6366F1;
            min-height: 1.6em;
            margin-bottom: 16px;
            word-break: break-word;
        }

        .type-btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .type-hint-btn {
            padding: 14px 12px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #4338CA;
            background: #EEF2FF;
            border: 2.5px solid #C7D2FE;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.12s, background 0.15s;
            -webkit-tap-highlight-color: transparent;
        }

        .type-hint-btn:active:not(:disabled) {
            transform: scale(0.96);
        }

        .type-hint-btn:disabled {
            opacity: 0.5;
            cursor: default;
        }

        .type-check-btn {
            padding: 14px 12px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #FFFFFF;
            background: linear-gradient(135deg, #6366F1, #4F46E5);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.12s;
            box-shadow: 0 4px 16px rgba(79, 70, 229, 0.25);
            -webkit-tap-highlight-color: transparent;
        }

        .type-check-btn:active:not(:disabled) {
            transform: scale(0.96);
        }

        .type-check-btn:disabled {
            opacity: 0.5;
            cursor: default;
        }

        /* End screen */
        .quiz-end {
            display: none;
            text-align: center;
            padding: 20px 0;
        }

        .quiz-end .end-emoji {
            font-size: 4rem;
            margin-bottom: 16px;
        }

        .quiz-end .end-score {
            font-size: 1.8rem;
            font-weight: 800;
            color: #4338CA;
            margin-bottom: 8px;
        }

        .quiz-end .end-message {
            font-size: 1.2rem;
            color: #4B5563;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        /* === Story Reader Styles === */

        .story-container {
            width: 100%;
            max-width: 400px;
            display: none;
        }

        .story-card {
            background: #FFFFFF;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(79, 70, 229, 0.15);
            padding: 32px 24px;
        }

        .story-toc-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #4338CA;
            text-align: center;
            margin-bottom: 4px;
        }


        .story-toc-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .story-toc-item {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            padding: 18px 20px;
            font-size: 1.25rem;
            font-weight: 600;
            color: #4338CA;
            background: #F0EDFF;
            border: 2.5px solid #C7D2FE;
            border-radius: 16px;
            cursor: pointer;
            text-align: left;
            transition: transform 0.12s, background 0.15s;
            -webkit-tap-highlight-color: transparent;
        }

        .story-toc-item:active {
            transform: scale(0.97);
            background: #E0DDFF;
        }

        .story-toc-item-number {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366F1, #4F46E5);
            color: #FFFFFF;
            font-size: 1.2rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .story-toc-item-title {
            flex: 1;
        }

        /* Chapter Reader */
        .story-header {
            border-bottom: 2px solid #E0E7FF;
            padding-bottom: 14px;
            margin-bottom: 20px;
        }

        .story-chapter-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: #4338CA;
            margin-bottom: 6px;
        }

        .story-page-indicator {
            font-size: 1.1rem;
            font-weight: 600;
            color: #6366F1;
        }

        .story-progress-bar {
            width: 100%;
            height: 6px;
            background: #E0E7FF;
            border-radius: 3px;
            margin-top: 10px;
            overflow: hidden;
        }

        .story-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #6366F1, #4F46E5);
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .story-page-content {
            font-size: 1.5rem;
            color: #1F2937;
            line-height: 1.8;
            min-height: 200px;
            padding: 8px 0;
        }

        .story-page-content p {
            margin-bottom: 16px;
        }

        .story-page-content strong {
            font-weight: 800;
            color: #4338CA;
        }

        .story-page-content h3,
        .story-page-content h4 {
            color: #4338CA;
            font-weight: 800;
            line-height: 1.3;
            margin: 8px 0 16px;
        }

        .story-page-content h3 {
            font-size: 1.5rem;
        }

        .story-page-content h4 {
            font-size: 1.25rem;
        }

        .story-divider {
            border: none;
            border-top: 2px solid #E0E7FF;
            width: 60%;
            margin: 28px auto;
        }

        .glossary-word {
            border-bottom: 1px dotted #6366F1;
            cursor: pointer;
            color: inherit;
        }
        .glossary-word:active {
            background: #EEF2FF;
        }

        .glossary-popover {
            position: fixed;
            z-index: 100;
            max-width: 280px;
            background: #FFFFFF;
            border: 2px solid #C7D2FE;
            border-radius: 14px;
            padding: 14px 16px;
            box-shadow: 0 8px 32px rgba(79, 70, 229, 0.22);
            animation: tts-slide-in 0.18s ease;
        }
        .glossary-popover-close {
            position: absolute;
            top: 6px;
            right: 8px;
            border: none;
            background: none;
            font-size: 1.3rem;
            line-height: 1;
            color: #818CF8;
            cursor: pointer;
            padding: 2px 6px;
        }
        .glossary-popover-term {
            font-weight: 700;
            color: #4338CA;
            font-size: 1.05rem;
            margin-bottom: 4px;
            padding-right: 18px;
        }
        .glossary-popover-meaning {
            font-size: 0.95rem;
            color: #1F2937;
            line-height: 1.5;
        }
        .glossary-popover-meaning em {
            color: #4B5563;
        }

        .story-toc-item-sub {
            display: block;
            font-size: 0.95rem;
            font-weight: 600;
            color: #818CF8;
            margin-top: 2px;
        }

        .story-nav {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .story-main-btn {
            width: 100%;
            padding: 20px;
            font-size: 1.4rem;
            font-weight: 700;
            color: #FFFFFF;
            background: linear-gradient(135deg, #6366F1, #4F46E5);
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 4px 16px rgba(79, 70, 229, 0.3);
            -webkit-tap-highlight-color: transparent;
        }

        .story-main-btn:active {
            transform: scale(0.97);
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.3);
        }

        .story-back-page-btn {
            width: 100%;
            padding: 14px;
            font-size: 1.15rem;
            font-weight: 600;
            color: #6366F1;
            background: #F0EDFF;
            border: 2px solid #C7D2FE;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.12s;
            -webkit-tap-highlight-color: transparent;
        }

        .story-back-page-btn:active {
            transform: scale(0.97);
        }

        .story-back-page-btn.hidden {
            display: none;
        }

        .story-toc-btn {
            display: block;
            width: 100%;
            margin-top: 16px;
            padding: 16px;
            font-size: 1.2rem;
            font-weight: 700;
            color: #4338CA;
            background: rgba(255, 255, 255, 0.8);
            border: 2.5px solid #C7D2FE;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.12s;
            -webkit-tap-highlight-color: transparent;
            text-align: center;
        }

        .story-toc-btn:active {
            transform: scale(0.97);
        }

        /* TTS Controls */
        .tts-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tts-play-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 20px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #4338CA;
            background: #F0EDFF;
            border: 2px solid #C7D2FE;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.12s, background 0.15s, color 0.15s;
            -webkit-tap-highlight-color: transparent;
        }

        .tts-play-btn:active {
            transform: scale(0.97);
        }

        .tts-play-btn.loading {
            color: #6366F1;
            cursor: wait;
        }

        .tts-play-btn.playing {
            color: #FFFFFF;
            background: linear-gradient(135deg, #6366F1, #4F46E5);
            border-color: #4F46E5;
        }

        .tts-play-btn.error {
            color: #991B1B;
            background: #FEE2E2;
            border-color: #F87171;
        }

        .tts-play-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .tts-icon.spinning {
            display: inline-block;
            animation: tts-spin 1s linear infinite;
        }

        @keyframes tts-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .tts-settings-btn {
            width: 48px;
            font-size: 1.3rem;
            color: #6366F1;
            background: #F0EDFF;
            border: 2px solid #C7D2FE;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.12s;
            -webkit-tap-highlight-color: transparent;
            flex-shrink: 0;
        }

        .tts-settings-btn:active {
            transform: scale(0.97);
        }

        .tts-settings-btn.active {
            background: #6366F1;
            color: #FFFFFF;
            border-color: #4F46E5;
        }

        .tts-settings-panel {
            background: #F8F7FF;
            border: 2px solid #C7D2FE;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .tts-settings-header {
            font-size: 1rem;
            font-weight: 700;
            color: #4338CA;
            margin-bottom: 12px;
        }

        .tts-field {
            margin-bottom: 12px;
        }

        .tts-field label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #4338CA;
            margin-bottom: 4px;
        }

        .tts-field select,
        .tts-field input {
            width: 100%;
            padding: 8px 12px;
            font-size: 0.95rem;
            border: 2px solid #C7D2FE;
            border-radius: 10px;
            background: #FFFFFF;
            color: #1E1B4B;
            box-sizing: border-box;
        }

        .tts-voice-presets {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }

        .tts-voice-chip {
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #4338CA;
            background: #FFFFFF;
            border: 2px solid #C7D2FE;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }

        .tts-voice-chip.active {
            background: #6366F1;
            color: #FFFFFF;
            border-color: #4F46E5;
        }

        .tts-preview-btn {
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #4338CA;
            background: #E0E7FF;
            border: 2px solid #C7D2FE;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.12s;
        }

        .tts-preview-btn:active {
            transform: scale(0.97);
        }

        .tts-notification {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 16px;
            animation: tts-slide-in 0.3s ease;
        }

        .tts-notification.warning {
            background: #FEF3C7;
            border: 2px solid #F59E0B;
            color: #92400E;
        }

        .tts-notification.error {
            background: #FEE2E2;
            border: 2px solid #F87171;
            color: #991B1B;
        }

        @keyframes tts-slide-in {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <h1>My English Words</h1>

    <div class="menu-wrap">
        <button class="hamburger" id="hamburgerBtn" aria-label="Open menu" aria-expanded="false">
            <span class="hamburger-icon">☰</span>
            <span class="hamburger-label" id="hamburgerLabel">Flashcards 1</span>
        </button>
        <div class="mode-toggle" id="modeToggle">
            <button class="mode-btn active" id="flashcardsTab">Flashcards 1</button>
            <button class="mode-btn" id="quizTab">Quiz 1</button>
            <button class="mode-btn" id="flashcards2Tab">Flashcards 2</button>
            <button class="mode-btn" id="quiz2Tab">Quiz 2</button>
            <button class="mode-btn" id="typeQuizTab">Type Quiz</button>
            <button class="mode-btn" id="storyTab">Story</button>
            <button class="mode-btn" id="talkTab">Talk</button>
        </div>
    </div>

    <div class="card-container">
        <div class="card">
            <img class="card-image" id="cardImage" src="" alt="">
            <div class="word" id="word"></div>
            <div class="sentence" id="sentence"></div>
        </div>
    </div>

    <div class="progress" id="progress"></div>

    <div class="btn-row">
        <button class="nav-btn" id="backBtn">← Back</button>
        <button class="nav-btn" id="nextBtn">Next →</button>
    </div>

    <!-- Quiz Game -->
    <div class="quiz-container" id="quizContainer">
        <div class="quiz-card">
